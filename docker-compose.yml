# ============================================================================
# DevHub — full-stack docker-compose
# ----------------------------------------------------------------------------
# Starts the Spring Boot backend (port 8080) + nginx frontend (port 8081).
# One command from the repo root:
#
#   docker compose up --build          # first time / after code changes
#   docker compose up                  # subsequent starts (uses cached image)
#   docker compose down                # stop and remove containers
#   docker compose logs -f backend     # tail backend logs
#
# The backend uses H2 in-memory by default so no external DB is needed.
# For PostgreSQL in prod, override DATABASE_URL / DATABASE_USERNAME / PASSWORD
# via a .env file or your CI/CD secret injection.
# ============================================================================

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # H2 in-memory — easy local dev; swap for jdbc:postgresql://... in prod
      DATABASE_URL: jdbc:h2:mem:devhub;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
      DATABASE_USERNAME: sa
      DATABASE_PASSWORD: ""
      JWT_SECRET: devhub-dev-only-secret-change-before-production-needs-32-chars
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:5500"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      # Serve the static DevHub pages read-only
      - ./frontend:/usr/share/nginx/html:ro
      # nginx config: clean URLs + /api proxy to Spring Boot
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
