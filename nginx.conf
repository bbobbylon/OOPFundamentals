server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # app.html is the hub entry point — map /app and / to it
    index app.html;
    location = / { return 301 /app; }

    # Try exact file, then filename.html (clean URLs), then 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Proxy /api/* to the Spring Boot backend container
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Gzip text assets to reduce transfer size
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/html text/css application/javascript application/json;

    # Long cache for content-hashed assets; short cache for HTML
    location ~* \.(css|js|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }
}
