spring:
  profiles:
    active: dev
  application:
    name: devhub-backend
  jpa:
    # Close the persistence context at the end of the service call rather than
    # holding it open through view rendering. Safe here: every controller returns
    # a DTO (no entity serialization), User.roles is EAGER, and the only LAZY
    # association (TopicProgress.user) is never touched during DTO mapping.
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:devhub-super-secret-key-change-this-in-production-min-32-chars}
    expiration-ms: 86400000   # 24 hours
  # Self-hosted OIDC issuer/resource-server (RS256). The issuer string only has to
  # match between the token we mint and the validator; we validate with an in-memory
  # public key, so it need not be a reachable URL.
  oidc:
    issuer: ${OIDC_ISSUER:http://localhost:8081}
    audience: ${OIDC_AUDIENCE:devhub-api}
    ttl-seconds: ${OIDC_TTL_SECONDS:3600}
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,https://bbobbylon.github.io"
  # Server-side code runner (Python / TypeScript / Shell). Enabled for local + Docker;
  # DISABLED in prod (application-prod.yml) — an open runner on a public host is RCE.
  exec:
    enabled: ${EXEC_ENABLED:true}
    timeout-ms: ${EXEC_TIMEOUT_MS:5000}
    max-output-bytes: 64000
    max-code-bytes: 100000
    max-concurrent: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
