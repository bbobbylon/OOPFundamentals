spring:
  profiles:
    active: dev
  application:
    name: devhub-backend

app:
  jwt:
    secret: ${JWT_SECRET:devhub-super-secret-key-change-this-in-production-min-32-chars}
    expiration-ms: 86400000   # 24 hours
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5500
      - http://127.0.0.1:5500
      - https://bbobbylon.github.io

management:
  endpoints:
    web:
      exposure:
        include: health,info
