spring:
  datasource:
    url: jdbc:h2:mem:devhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

server:
  port: 8081

logging:
  level:
    com.bob.devhub: DEBUG

app:
  jwt:
    # Dev-only fallback so `./startapp.sh` / `dev.ps1` boot with no env set. This key
    # is NEVER used in prod: application-prod.yml inherits the base ${JWT_SECRET},
    # which has no default, so prod refuses to start without a real secret.
    secret: ${JWT_SECRET:devhub-dev-only-insecure-secret-change-me-32plus-bytes-xxxx}
