spring:
  datasource:
    url: jdbc:h2:mem:devhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

server:
  port: 8081

logging:
  level:
    com.bob.devhub: DEBUG
