spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 'update' auto-creates/updates tables on first boot — needed because
      # this project has no migration tool. (A real production app would use
      # Flyway/Liquibase with ddl-auto: validate instead.)
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}

app:
  # The HS256 signing secret is REQUIRED in prod and has NO fallback — the app
  # refuses to start without JWT_SECRET, so it can never run on a committed dev key.
  jwt:
    secret: ${JWT_SECRET}
  # Comma-separated list of allowed browser origins (your GitHub Pages URL).
  # Override per-deployment via the CORS_ALLOWED_ORIGINS environment variable,
  # e.g. CORS_ALLOWED_ORIGINS=https://yourname.github.io
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://bbobbylon.github.io}
  # Code execution is OFF by default in prod. Running untrusted code on a public
  # host is remote code execution; only flip EXEC_ENABLED=true on an isolated,
  # throwaway instance you fully control. Auth/identity works regardless.
  exec:
    enabled: ${EXEC_ENABLED:false}
