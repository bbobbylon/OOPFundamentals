<body class="track-web-fundamentals">
<div class="container">
  <a class="back" href="app.html">← Hub</a>
  <h1>Web Fundamentals — Flashcards</h1>
  <p class="sub">HTML semantics/forms/accessibility, CSS box model/specificity, Flexbox &amp; Grid layout, JavaScript fundamentals, the DOM &amp; events, async JavaScript, and browser rendering. Front = the concept; back = what it means and the gotcha it trips up beginners on.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'web-fundamentals-core', title: 'Web Fundamentals', subtitle: 'name the concept', accent: '#e34c26',
  cards: [
    { front: 'Semantic HTML', hint: 'html', back: 'Elements like <nav>, <article>, <aside> that convey MEANING (to screen readers, search crawlers, other devs) with no default visual difference from a <div>. Purely informational value.' },
    { front: 'required / type="email" validation', hint: 'html', back: 'HTML5 constraint validation attributes are enforced natively by the browser — blocks submission, shows a built-in message, zero JavaScript needed. Server-side validation is still required since client checks can be bypassed.' },
    { front: 'label for= / input id= association', hint: 'html', back: 'Programmatically links label text to its input: screen readers announce the label on focus, and clicking the label focuses/activates the input. Without it, a screen reader user gets no context.' },
    { front: 'alt="" (empty) vs omitted alt', hint: 'html', back: 'alt="" (present, empty) deliberately marks an image as decorative — skipped by screen readers. Omitting alt entirely is an authoring error, often announced as the raw filename — worse, not better.' },
    { front: 'box-sizing: content-box vs border-box', hint: 'css', back: 'content-box (default): width = content only; padding + border ADD on top, inflating rendered size. border-box: width INCLUDES padding + border, so the declared width is the actual rendered width. A `* { box-sizing: border-box }` reset is common.' },
    { front: 'CSS specificity', hint: 'css', back: '4-tier score: inline styles > ID selectors > class/attribute/pseudo-class selectors > element selectors. Higher specificity wins regardless of source order; source order is only the tiebreaker when specificity ties exactly.' },
    { front: 'Pseudo-class vs pseudo-element', hint: 'css', back: 'Pseudo-class (:hover, :nth-child) selects a REAL element in a given state/position. Pseudo-element (::before, ::after) targets a sub-part that is not its own DOM node — needs a content property to render anything.' },
    { front: 'Child combinator (>) vs descendant combinator (space)', hint: 'css', back: '.card > p matches only DIRECT children. .card p matches a <p> at ANY nesting depth inside .card, including grandchildren. > is strict; space is loose.' },
    { front: 'justify-content vs align-items', hint: 'layout', back: 'justify-content aligns the MAIN axis; align-items aligns the CROSS axis. With flex-direction: row, main=horizontal, cross=vertical — swap to column and their visual effect swaps too.' },
    { front: 'CSS Grid fr unit', hint: 'layout', back: 'Divides available space proportionally by the SUM of fr values used. grid-template-columns: 1fr 2fr 1fr on 400px = 4 total shares of 100px each, so 2fr = 200px. Not a fixed percentage.' },
    { front: 'Mobile-first min-width media queries', hint: 'layout', back: '@media (min-width: 768px) matches 768px AND WIDER. Base (no-query) styles target the smallest screen; ascending min-width breakpoints progressively layer on overrides as the viewport grows.' },
    { front: 'flex: grow shrink basis shorthand', hint: 'layout', back: 'flex-basis = starting size before growing/shrinking. flex-grow = share of leftover space claimed (0 = never grow). flex-shrink = how much it shrinks under pressure (0 = never shrink below basis) — useful for a fixed-width sidebar.' },
    { front: 'var vs let/const scoping', hint: 'js', back: 'var is FUNCTION-scoped (leaks out of if/for blocks). let/const are BLOCK-scoped, confined to the nearest {}. Classic proof: a var-based for-loop with setTimeout logs the final value N times; let logs each iteration value correctly.' },
    { front: 'Closure', hint: 'js', back: 'A function bundled with references to its enclosing (lexical) scope. If an inner function returned from an outer function still references an outer variable, that variable stays alive in memory — the mechanism behind private state without classes.' },
    { front: 'this in a regular function vs arrow function', hint: 'js', back: 'A regular function\'s `this` is determined by HOW it\'s called (call-site), not where it\'s defined — passing a method as a plain callback (e.g. to setTimeout) loses the original object binding. Arrow functions have no own `this` — they inherit it lexically from the enclosing scope.' },
    { front: 'Hoisting & the temporal dead zone', hint: 'js', back: 'var is hoisted AND initialized to undefined — accessing it early logs undefined. let/const are hoisted but left UNINITIALIZED (the "temporal dead zone") — accessing them before their declaration line throws a ReferenceError, a deliberate ES6 safety design.' },
    { front: 'map() vs forEach()', hint: 'js', back: 'map() returns a NEW array built from the callback\'s return values — use it when you need transformed data. forEach() always returns undefined and exists purely for side effects — calling .map() and discarding the result is a code smell.' },
    { front: 'Event delegation', hint: 'dom', back: 'One listener on a stable parent (exploiting event bubbling) instead of one listener per child. Uses far less memory, and automatically covers children added to the DOM later with nothing to re-attach.' },
    { front: 'Event bubbling vs capturing', hint: 'dom', back: 'Every event travels capture phase (window → target) then bubble phase (target → window). addEventListener listens on the BUBBLING phase by default (capture: false) unless capture: true is explicitly passed.' },
    { front: 'querySelector vs getElementById', hint: 'dom', back: 'querySelector accepts ANY CSS selector (classes, attributes, combinators) — far more flexible. getElementById only matches by id, but is typically faster for that one narrow, purpose-built case.' },
    { front: 'Promise states', hint: 'async', back: 'pending → settles EXACTLY ONCE → fulfilled or rejected, never back to pending, never both. This "settle once, immutably" guarantee is why .then() attached late still fires with the already-determined result.' },
    { front: 'fetch() and HTTP error status codes', hint: 'async', back: 'fetch() only REJECTS on a network-level failure (no connectivity, CORS block) — a 404 or 500 still RESOLVES successfully, since a response was received. Must check res.ok / res.status manually to detect an HTTP error.' },
    { front: 'Microtask queue vs macrotask queue', hint: 'async', back: 'After the sync call stack empties, the event loop drains the ENTIRE microtask queue (Promise .then, async/await) before running even one macrotask (setTimeout, I/O). setTimeout(fn, 0) always waits behind already-queued Promise callbacks.' },
    { front: 'Critical rendering path', hint: 'render', back: 'DOM + CSSOM built in parallel (from HTML/CSS) → merged into a Render Tree (visible nodes + computed styles) → Layout (compute geometry) → Paint (fill pixels) → Composite (assemble layers, often GPU-accelerated).' },
    { front: 'Parser-blocking <script> vs defer/async', hint: 'render', back: 'A plain <script src> in <head> halts HTML parsing until it downloads and executes. defer downloads in parallel, executes after parsing completes (in order). async downloads in parallel, executes as soon as ready (out of order).' },
    { front: 'Reflow vs repaint vs composite', hint: 'render', back: 'Changing GEOMETRY (width, top/left) forces Layout to re-run (reflow), then Paint, then Composite — expensive, can cascade to siblings. Changing only PIXELS (background-color) skips straight to Paint+Composite — cheaper. transform/opacity skip both, going straight to cheap GPU compositing.' }
  ]
});
</script>
