<div class="container">
  <a class="back" href="docker-index.html">← Docker</a>
  <h1>Docker — Flashcards</h1>
  <p class="sub">Images, layers, the Dockerfile instructions, networking, volumes, and Compose. Front = command or concept; back = what it does and why it matters.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'docker-core', title: 'Docker', subtitle: 'name what it does', accent: '#2496ed',
  cards: [
    { front: 'Image vs container', hint: 'core', back: 'Image = a read-only template (the build artifact). Container = a running (or stopped) INSTANCE of an image with a thin writable layer on top. One image, many containers.' },
    { front: 'Layers', hint: 'images', back: 'Each Dockerfile instruction adds a cached, content-addressed layer. Layers are shared between images and re-used on rebuild if unchanged — which is why instruction ORDER matters for cache hits.' },
    { front: 'Container vs VM', hint: 'core', back: 'Containers share the host kernel and isolate via namespaces/cgroups — lightweight, fast to start. VMs virtualize hardware and run a full guest OS — heavier, stronger isolation.' },
    { front: 'docker build -t name:tag .', hint: 'build', back: 'Build an image from the Dockerfile in . (the build context) and tag it. The context is sent to the daemon — keep it small with .dockerignore.' },
    { front: 'docker run', hint: 'run', back: 'Create + start a container from an image. Common flags: -d (detached), -p host:container (publish port), -e (env var), --name, -v (volume), --rm (auto-remove on exit).' },
    { front: 'FROM', hint: 'dockerfile', back: 'The base image a build starts from (e.g. FROM eclipse-temurin:21-jre). The first instruction; choose a slim/distroless base to shrink the image and attack surface.' },
    { front: 'RUN vs CMD vs ENTRYPOINT', hint: 'dockerfile', back: 'RUN executes at BUILD time (adds a layer). CMD/ENTRYPOINT define what runs at START. ENTRYPOINT = the fixed executable; CMD = default args (overridable on docker run).' },
    { front: 'COPY vs ADD', hint: 'dockerfile', back: 'COPY just copies files into the image (predictable — prefer it). ADD also auto-extracts local tarballs and can fetch URLs — extra magic you usually do not want.' },
    { front: 'WORKDIR', hint: 'dockerfile', back: 'Sets the working directory for subsequent RUN/CMD/COPY (creating it if needed). Cleaner and safer than chaining cd in RUN commands.' },
    { front: 'EXPOSE', hint: 'dockerfile', back: 'Documents which port the container listens on — metadata only. It does NOT publish the port; you still need docker run -p to map it to the host.' },
    { front: 'ENV vs ARG', hint: 'dockerfile', back: 'ENV sets a variable available at build AND run time (persists in the image). ARG is build-time only (e.g. a version), not present in the running container.' },
    { front: 'Multi-stage build', hint: 'optimize', back: 'Use multiple FROM stages: a heavy builder stage compiles, a slim final stage COPYs only the artifact. Result: a tiny runtime image with no build tools or source.' },
    { front: '.dockerignore', hint: 'optimize', back: 'Excludes files (node_modules, .git, target) from the build context so they are not sent to the daemon or accidentally COPYed — faster builds, smaller images, fewer leaks.' },
    { front: 'Layer cache & ordering', hint: 'optimize', back: 'Copy dependency manifests and install deps BEFORE copying source. Then a code change does not bust the dependency layer, so rebuilds reuse the cached install.' },
    { front: 'Volume vs bind mount', hint: 'storage', back: 'Volume = Docker-managed storage (docker volume), portable and the default for data. Bind mount = a host path mapped in, great for live-reloading source in dev.' },
    { front: 'Why containers are ephemeral', hint: 'storage', back: 'The writable container layer is destroyed when the container is removed. Persist anything that must survive (DB data) in a volume, not in the container filesystem.' },
    { front: 'Bridge network', hint: 'networking', back: 'The default network: containers on the same user-defined bridge can reach each other BY NAME via Docker built-in DNS. Compose puts your services on one automatically.' },
    { front: 'Publish a port (-p)', hint: 'networking', back: '-p 8080:80 maps host port 8080 to container port 80. Without publishing, a port is only reachable from other containers on the same network, not the host.' },
    { front: 'docker exec -it <c> sh', hint: 'debug', back: 'Run a command (here an interactive shell) INSIDE a running container — the go-to for debugging what is actually happening in there.' },
    { front: 'docker logs / docker ps', hint: 'inspect', back: 'docker logs <c> streams a container stdout/stderr. docker ps lists running containers (-a includes stopped). First stops in any debugging session.' },
    { front: 'Image tag & latest', hint: 'registry', back: 'Tags name image versions (myapp:1.2). latest is just a default tag, NOT a guarantee of newest — pin explicit versions in production for reproducibility.' },
    { front: 'docker push / pull', hint: 'registry', back: 'push uploads an image to a registry (Docker Hub, ECR, ACR); pull downloads it. CI builds and pushes; the cluster pulls by tag/digest.' },
    { front: 'HEALTHCHECK', hint: 'ops', back: 'A Dockerfile instruction defining how to test the container is alive (e.g. curl /actuator/health). Orchestrators use the status to restart or route around unhealthy containers.' },
    { front: 'Run as non-root (USER)', hint: 'security', back: 'Containers default to root. Add a USER instruction to drop privileges — limits the blast radius if the app is compromised. A standard hardening step.' },
    { front: 'docker compose up', hint: 'compose', back: 'Reads docker-compose.yml and starts the whole multi-service app (build if needed, create network, start in dependency order). --build forces a rebuild; -d detaches.' },
    { front: 'Compose: depends_on', hint: 'compose', back: 'Controls START order, but NOT readiness — it does not wait for the DB to accept connections. Add a healthcheck + condition: service_healthy for true readiness.' },
    { front: 'docker system prune', hint: 'cleanup', back: 'Reclaims space by removing stopped containers, unused networks, dangling images (and with -a, all unused images). Run when Docker has eaten your disk.' }
  ]
});
</script>
