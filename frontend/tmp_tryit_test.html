<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>tryit widget test</title>
  <style>
    :root{--bg:#0f172a;--panel:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#22d3ee;--border:#334155}
    body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,sans-serif;padding:24px;max-width:900px;margin:0 auto}
  </style>
</head>
<body>
<h1>Try It widget — all four languages</h1>

<div class="tryit" data-lang="js" data-title="JS test" data-predict="What does the closure print?">
<script type="text/plain">
const counters = [];
for (let i = 0; i < 3; i++) counters.push(() => i);
console.log(counters.map(f => f()));
console.warn('a warning line');
</script>
</div>

<div class="tryit" data-lang="ts" data-title="TS test">
<script type="text/plain">
interface User { name: string; roles: string[] }
const u: User = { name: 'Bobby', roles: ['admin'] };
function hasRole<T extends User>(user: T, role: string): boolean {
  return user.roles.includes(role);
}
console.log(u.name, 'admin?', hasRole(u, 'admin'));
</script>
</div>

<div class="tryit" data-lang="python" data-title="Python test">
<script type="text/plain">
def fib():
    a, b = 0, 1
    while True:
        yield a
        a, b = b, a + b

g = fib()
print([next(g) for _ in range(10)])
</script>
</div>

<div class="tryit" data-lang="java" data-title="Java test">
<script type="text/plain">
import java.util.*;

public class Main {
    public static void main(String[] args) {
        List<Integer> xs = new ArrayList<>(Arrays.asList(5, 3, 1, 4, 2));
        Collections.sort(xs);
        System.out.println("sorted: " + xs);
    }
}
</script>
</div>

<script src="devhub-tryit.js"></script>
</body>
</html>
