<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Certification Readiness — Exam Prep</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0;
      --muted: #94a3b8; --accent: #a78bfa; --border: #334155;
      --good: #34d399; --warn: #fbbf24; --bad: #f87171; --blue: #22d3ee;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .container { max-width: 920px; margin: 0 auto; }
    a.back { color: var(--blue); text-decoration: none; font-size: 14px; }
    h1 { margin: 6px 0 4px; font-size: 26px; color: var(--accent); }
    p.sub { margin: 0 0 22px; color: var(--muted); line-height: 1.6; }

    /* overall summary */
    .summary { display: flex; gap: 18px; align-items: center; background: var(--panel);
      border: 1px solid var(--border); border-radius: 14px; padding: 20px 24px; margin-bottom: 22px; flex-wrap: wrap; }
    .ring { --p: 0; width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
      background: conic-gradient(var(--accent) calc(var(--p) * 1%), #0b1426 0);
      display: flex; align-items: center; justify-content: center; }
    .ring > div { width: 74px; height: 74px; border-radius: 50%; background: var(--panel);
      display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring b { font-size: 22px; font-weight: 800; line-height: 1; }
    .ring span { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 2px; }
    .summary-text h3 { margin: 0 0 4px; font-size: 17px; }
    .summary-text p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }

    .sec-h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
      margin: 26px 0 10px; }

    /* exam cards */
    .ex { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 18px; margin-bottom: 12px; }
    .ex.dim { opacity: .55; }
    .ex-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .ex-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .ex-cert { font-size: 11px; font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--accent);
      background: rgba(167,139,250,.12); border-radius: 5px; padding: 2px 8px; }
    .ex-track { font-size: 11.5px; color: var(--muted); margin-left: auto; }
    .ex-bar-wrap { display: flex; align-items: center; gap: 12px; margin: 13px 0 4px; }
    .ex-bar { position: relative; flex: 1; height: 12px; background: #0b1426; border: 1px solid var(--border);
      border-radius: 7px; overflow: hidden; }
    .ex-bar i { display: block; height: 100%; border-radius: 6px; }
    .ex-pass { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .8; }
    .ex-pct { width: 78px; text-align: right; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .ex-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
    .ex-meta .weak { color: var(--warn); }
    .ex-actions { margin-top: 14px; display: flex; gap: 10px; align-items: center; }
    .btn { font: inherit; font-size: 13px; font-weight: 700; border-radius: 9px; padding: 8px 16px; cursor: pointer;
      border: 1px solid var(--accent); background: var(--accent); color: #0b1020; transition: filter .12s; }
    .btn:hover { filter: brightness(1.08); }
    .btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn.ghost:hover { border-color: var(--accent); }
    .badge { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      padding: 2px 9px; border-radius: 20px; }
    .badge.ready { color: var(--good); background: rgba(52,211,153,.14); }
    .badge.prog { color: var(--warn); background: rgba(251,191,36,.14); }
    .badge.new { color: var(--blue); background: rgba(34,211,238,.12); }
    .badge.soon { color: var(--muted); background: #0b1426; border: 1px solid var(--border); }
    .empty { color: var(--muted); font-size: 13px; }
  </style>
  <link rel="stylesheet" href="devhub.css" />
</head>
<body class="track-cloud">
<div class="container">
  <a class="back" href="app.html">← Hub</a>
  <h1>🎓 Certification Readiness</h1>
  <p class="sub">Your live scorecard across every DevHub practice exam. "Am I ready?" stops being a feeling and becomes a number — pass an exam three times and the bar turns green.</p>

  <div id="dash"></div>
</div>

<script src="devhub-quiz.js"></script>
<script src="quiz-banks.js"></script>
<script>
(function () {
  var exams = window.DEVHUB_EXAMS || [];
  var root = document.getElementById('dash');

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function goto(file) {
    try { window.parent.postMessage({ type: 'dlh-navigate', file: file }, '*'); } catch (e) {}
    if (window.parent === window) window.location.href = file;
  }

  /* aggregate one exam's history into a summary */
  function summarise(ex) {
    var hist = (window.DevHubQuiz && DevHubQuiz.loadHistory(ex.id)) || [];
    var best = hist.reduce(function (m, a) { return Math.max(m, a.pct); }, 0);
    // aggregate per-domain across all attempts for a stable "weak area"
    var agg = {};
    hist.forEach(function (a) {
      if (!a.domains) return;
      Object.keys(a.domains).forEach(function (d) {
        var s = agg[d] || (agg[d] = { c: 0, n: 0 });
        s.c += a.domains[d].c; s.n += a.domains[d].n;
      });
    });
    var weak = null, weakPct = 101;
    Object.keys(agg).forEach(function (d) {
      var p = agg[d].n ? Math.round(agg[d].c / agg[d].n * 100) : 100;
      if (p < weakPct) { weakPct = p; weak = d; }
    });
    return { hist: hist, attempts: hist.length, best: best, weak: weak, weakPct: weakPct,
             last: hist.length ? hist[0].at : null };
  }

  function statusOf(ex, s) {
    if (!ex.available) return 'soon';
    if (s.attempts === 0) return 'new';
    return s.best >= ex.passPct ? 'ready' : 'prog';
  }

  function barColor(status) {
    return status === 'ready' ? 'var(--good)' : status === 'prog' ? 'var(--warn)' : 'var(--border)';
  }

  /* ---- overall summary ring ---- */
  var available = exams.filter(function (e) { return e.available; });
  var summaries = {};
  available.forEach(function (e) { summaries[e.id] = summarise(e); });
  var readyCount = available.filter(function (e) { return summaries[e.id].best >= e.passPct; }).length;
  var attemptedBests = available.map(function (e) { return summaries[e.id].best; });
  var avgBest = attemptedBests.length ? Math.round(attemptedBests.reduce(function (a, b) { return a + b; }, 0) / attemptedBests.length) : 0;

  var ring = el('div', 'ring');
  ring.style.setProperty('--p', avgBest);
  ring.appendChild(el('div', null, '<b>' + avgBest + '%</b><span>avg best</span>'));
  var stext = el('div', 'summary-text');
  stext.appendChild(el('h3', null, readyCount + ' of ' + available.length + ' exams at pass level'));
  stext.appendChild(el('p', null,
    available.length
      ? 'Average of your best score on each available exam. Aim to get every bar green — then pass each in Exam mode three times before booking the real test.'
      : 'No exams available yet.'));
  var summary = el('div', 'summary');
  summary.appendChild(ring); summary.appendChild(stext);
  root.appendChild(summary);

  /* ---- available exams ---- */
  root.appendChild(el('div', 'sec-h', 'Available now'));
  if (!available.length) root.appendChild(el('div', 'empty', 'No exams available yet — check back soon.'));

  available.forEach(function (ex) {
    var s = summaries[ex.id];
    var status = statusOf(ex, s);
    var card = el('div', 'ex');

    var top = el('div', 'ex-top');
    top.appendChild(el('span', 'ex-title', ex.title));
    top.appendChild(el('span', 'ex-cert', ex.cert));
    var badgeTxt = status === 'ready' ? 'Pass-ready' : status === 'prog' ? 'In progress' : 'Not started';
    top.appendChild(el('span', 'badge ' + status, badgeTxt));
    top.appendChild(el('span', 'ex-track', ex.track));
    card.appendChild(top);

    var barWrap = el('div', 'ex-bar-wrap');
    var bar = el('div', 'ex-bar');
    var fill = el('i'); fill.style.width = s.best + '%'; fill.style.background = barColor(status);
    bar.appendChild(fill);
    var pass = el('span', 'ex-pass'); pass.style.left = ex.passPct + '%'; pass.title = 'pass mark ' + ex.passPct + '%';
    bar.appendChild(pass);
    barWrap.appendChild(bar);
    barWrap.appendChild(el('span', 'ex-pct', s.attempts ? s.best + '%' : '—'));
    card.appendChild(barWrap);

    var meta = el('div', 'ex-meta');
    meta.appendChild(el('span', null, ex.count + ' questions · pass ' + ex.passPct + '%'));
    meta.appendChild(el('span', null, s.attempts + ' attempt' + (s.attempts === 1 ? '' : 's')));
    if (s.last) meta.appendChild(el('span', null, 'last ' + new Date(s.last).toLocaleDateString()));
    if (s.weak && s.weakPct < 100) meta.appendChild(el('span', 'weak', '⚠ weakest: ' + s.weak + ' (' + s.weakPct + '%)'));
    card.appendChild(meta);

    var actions = el('div', 'ex-actions');
    var startBtn = el('button', 'btn', s.attempts ? 'Continue →' : 'Start exam →');
    startBtn.addEventListener('click', function () { goto(ex.file); });
    actions.appendChild(startBtn);
    card.appendChild(actions);

    root.appendChild(card);
  });

  /* ---- coming soon ---- */
  var soon = exams.filter(function (e) { return !e.available; });
  if (soon.length) {
    root.appendChild(el('div', 'sec-h', 'Coming soon'));
    soon.forEach(function (ex) {
      var card = el('div', 'ex dim');
      var top = el('div', 'ex-top');
      top.appendChild(el('span', 'ex-title', ex.title));
      top.appendChild(el('span', 'ex-cert', ex.cert));
      top.appendChild(el('span', 'badge soon', 'Coming soon'));
      top.appendChild(el('span', 'ex-track', ex.track));
      card.appendChild(top);
      root.appendChild(card);
    });
  }
})();
</script>
<script src="devhub-notebook.js"></script>
</body>
</html>
