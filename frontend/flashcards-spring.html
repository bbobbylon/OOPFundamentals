<body class="track-springboot">
<div class="container">
  <a class="back" href="spring-boot-index.html">← Spring Boot</a>
  <h1>Spring Annotations — Flashcards</h1>
  <p class="sub">Spring is annotation-driven; the Professional exam and daily work both demand you know what each one does. Front = annotation; back = its job.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'spring-annotations', title: 'Spring Annotations', subtitle: 'name what it does', accent: '#6db33f',
  cards: [
    { front: '@SpringBootApplication', hint: 'bootstrap', back: 'Meta-annotation = @Configuration + @EnableAutoConfiguration + @ComponentScan. Marks the main class.' },
    { front: '@Component', hint: 'stereotype', back: 'Generic stereotype — registers the class as a Spring-managed bean via component scanning.' },
    { front: '@Service', hint: 'stereotype', back: 'Stereotype for the business/service layer (a specialized @Component).' },
    { front: '@Repository', hint: 'stereotype', back: 'Stereotype for the persistence layer; also translates persistence exceptions.' },
    { front: '@Controller', hint: 'stereotype', back: 'Stereotype for a Spring MVC web controller (returns view names by default).' },
    { front: '@RestController', hint: 'web', back: '@Controller + @ResponseBody — handler return values serialized to the response body (JSON).' },
    { front: '@Configuration', hint: 'config', back: 'Marks a class that defines @Bean methods; CGLIB-proxied so inter-bean calls return singletons.' },
    { front: '@Bean', hint: 'config', back: 'On a method in a @Configuration class — its return value becomes a managed bean.' },
    { front: '@Autowired', hint: 'di', back: 'Injects a dependency by type (optional on a single constructor since Spring 4.3).' },
    { front: '@Qualifier', hint: 'di', back: 'Selects a specific bean by name when multiple candidates match.' },
    { front: '@Primary', hint: 'di', back: 'Marks the default bean to inject when several candidates of a type exist.' },
    { front: '@Value', hint: 'config', back: 'Injects a single property/expression value (e.g. @Value("${server.port}")).' },
    { front: '@ConfigurationProperties', hint: 'config', back: 'Binds a whole property prefix to a typed POJO.' },
    { front: '@Profile', hint: 'config', back: 'Registers a bean/config only when the named profile is active.' },
    { front: '@Scope', hint: 'lifecycle', back: 'Sets bean scope: singleton (default), prototype, request, session, etc.' },
    { front: '@PostConstruct / @PreDestroy', hint: 'lifecycle', back: 'Run a method after injection completes / before bean destruction.' },
    { front: '@Transactional', hint: 'data', back: 'Wraps the method in a transaction via an AOP proxy (begin/commit/rollback).' },
    { front: '@RequestMapping / @GetMapping / @PostMapping', hint: 'web', back: 'Map HTTP requests (path + method) to a handler method.' },
    { front: '@PathVariable', hint: 'web', back: 'Binds a URI template segment ({id}) to a method parameter.' },
    { front: '@RequestParam', hint: 'web', back: 'Binds a query-string (or form) parameter to a method parameter.' },
    { front: '@RequestBody', hint: 'web', back: 'Deserializes the HTTP request body (JSON) into a method-parameter object.' },
    { front: '@ResponseStatus', hint: 'web', back: 'Sets the HTTP status code for a handler or exception.' },
    { front: '@Valid', hint: 'validation', back: 'Triggers Bean Validation on a method argument; failure → MethodArgumentNotValidException (400).' },
    { front: '@RestControllerAdvice / @ExceptionHandler', hint: 'web', back: 'Centralized, cross-controller exception handling returning consistent error responses.' },
    { front: '@EnableMethodSecurity', hint: 'security', back: 'Turns on method-level security so @PreAuthorize/@PostAuthorize are enforced.' },
    { front: '@PreAuthorize', hint: 'security', back: 'Authorizes a method before it runs using a SpEL expression (e.g. hasRole(\'ADMIN\')).' },
    { front: '@SpringBootTest', hint: 'testing', back: 'Loads the full ApplicationContext for an integration test.' },
    { front: '@WebMvcTest / @DataJpaTest', hint: 'testing', back: 'Slice tests loading only the web layer / only the JPA layer.' },
    { front: '@MockBean', hint: 'testing', back: 'Adds/replaces a Mockito mock in the test ApplicationContext.' }
  ]
});
</script>
