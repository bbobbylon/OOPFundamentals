  <a class="back" href="git-index.html">← Git</a>
  <h1>Git Commands — Flashcards</h1>
  <p class="sub">The commands you reach for daily, plus the ones that save you in a crisis. Front = the task or command; back = what it does and the gotcha.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'git-commands', title: 'Git Commands', subtitle: 'what does it do', accent: '#f05133',
  cards: [
    { front: 'git add -p', hint: 'staging', back: 'Stage changes interactively, hunk by hunk — lets you commit part of a file and leave the rest unstaged. Great for splitting one messy edit into clean commits.' },
    { front: 'git commit --amend', hint: 'rewrite', back: 'Replace the most recent commit with a new one (fix the message or add staged changes). Rewrites history — never amend a commit you have already pushed/shared.' },
    { front: 'git reset --soft HEAD~1', hint: 'reset', back: 'Move HEAD back one commit but KEEP the changes staged. Undoes the commit, not the work — useful to recommit differently.' },
    { front: 'git reset --mixed (default)', hint: 'reset', back: 'Move HEAD back and unstage the changes, but keep them in the working tree. git reset HEAD~1 does this.' },
    { front: 'git reset --hard HEAD~1', hint: 'reset', back: 'Move HEAD back AND discard working-tree + staged changes. Destructive — the work is gone unless it is in the reflog. Use with care.' },
    { front: 'reset vs revert', hint: 'undo', back: 'reset MOVES the branch pointer (rewrites history) — for local/unshared work. revert creates a NEW commit that undoes a previous one (safe history) — for shared/pushed commits.' },
    { front: 'git revert <commit>', hint: 'undo', back: 'Make a new commit that applies the inverse of <commit>. History is preserved, so it is safe on a shared branch (unlike reset).' },
    { front: 'git rebase main', hint: 'history', back: 'Replay your branch commits on top of the latest main — a linear history with no merge commit. Rewrites your commits (new SHAs); do not rebase shared branches.' },
    { front: 'git rebase -i HEAD~3', hint: 'history', back: 'Interactive rebase: squash, reword, reorder, edit, or drop the last 3 commits. The tool for cleaning up a branch before a PR.' },
    { front: 'merge vs rebase', hint: 'integrate', back: 'merge preserves history and adds a merge commit (true record of when branches joined). rebase rewrites for a clean linear history. Team convention decides.' },
    { front: 'git cherry-pick <commit>', hint: 'apply', back: 'Apply a single commit from another branch onto the current one. Handy to pull one fix without merging the whole branch.' },
    { front: 'git stash / git stash pop', hint: 'shelve', back: 'Shelve uncommitted changes to get a clean tree, then reapply them later with pop. Use to switch branches mid-change.' },
    { front: 'git reflog', hint: 'recovery', back: 'A log of every place HEAD has pointed — even after reset/rebase. Your safety net: find the lost SHA, then git reset --hard <sha> or git checkout it to recover.' },
    { front: 'git log --oneline --graph --all', hint: 'inspect', back: 'A compact, visual commit graph across all branches — the fastest way to see how branches relate and where they diverged.' },
    { front: 'git diff vs git diff --staged', hint: 'inspect', back: 'git diff shows working-tree vs index (unstaged changes). git diff --staged (--cached) shows index vs HEAD (what a commit would include).' },
    { front: 'git fetch vs git pull', hint: 'remote', back: 'fetch downloads remote commits but does NOT change your branch. pull = fetch + merge (or rebase) into your current branch. fetch first when you want to inspect before integrating.' },
    { front: 'git pull --rebase', hint: 'remote', back: 'Fetch, then rebase your local commits on top of the upstream — avoids a noisy merge commit every time you sync. Common team default.' },
    { front: 'git push --force-with-lease', hint: 'remote', back: 'Force-push but ONLY if the remote has not moved since you last fetched — safer than --force because it refuses to clobber a teammate new commits.' },
    { front: 'git branch -d vs -D', hint: 'branches', back: '-d deletes a branch only if it is fully merged (safe). -D forces deletion even with unmerged commits (you could lose work).' },
    { front: 'git switch vs git checkout', hint: 'branches', back: 'switch is the modern, focused command to change branches (and -c to create). checkout is the old overloaded one (branches AND files). Prefer switch / restore.' },
    { front: 'git restore <file>', hint: 'undo', back: 'Discard working-tree changes to a file (restore from HEAD). git restore --staged <file> unstages without losing the edit. The modern replacement for checkout -- <file>.' },
    { front: 'git bisect', hint: 'debug', back: 'Binary-search the history to find the commit that introduced a bug: mark good and bad ends, test the midpoint, repeat. Finds the culprit in log2(N) steps.' },
    { front: 'git tag -a v1.0 -m', hint: 'release', back: 'Create an annotated (signed-able, dated, messaged) tag marking a release. Lightweight tags (no -a) are just a name; annotated tags are the real release markers.' },
    { front: 'HEAD, detached HEAD', hint: 'concepts', back: 'HEAD = pointer to your current commit/branch. Detached HEAD = HEAD points straight at a commit, not a branch — new commits there are unreachable unless you make a branch.' },
    { front: 'Fast-forward merge', hint: 'integrate', back: 'When the target branch has no new commits, Git just moves the pointer forward — no merge commit. --no-ff forces a merge commit to record that a branch existed.' },
    { front: 'git rm --cached <file>', hint: 'tracking', back: 'Stop tracking a file (e.g. a secret committed by mistake) while keeping it on disk. Add it to .gitignore so it does not come back.' },
    { front: '.gitignore', hint: 'config', back: 'Patterns of files Git should not track. Note: it only affects UNTRACKED files — already-tracked files keep being tracked until you git rm --cached them.' },
    { front: 'Merge conflict markers', hint: 'conflicts', back: '<<<<<<< HEAD (your side), ======= (divider), >>>>>>> branch (their side). Edit to the desired result, remove the markers, then git add to mark resolved.' }
  ]
});
</script>
