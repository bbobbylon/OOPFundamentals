  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0;
      --muted: #94a3b8; --accent: #a78bfa; --border: #334155;
      --good: #34d399; --warn: #fbbf24; --bad: #f87171; --blue: #22d3ee;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .container { max-width: 920px; margin: 0 auto; }
    a.back { color: var(--blue); text-decoration: none; font-size: 14px; }
    h1 { margin: 6px 0 4px; font-size: 26px; color: var(--accent); }
    p.sub { margin: 0 0 22px; color: var(--muted); line-height: 1.6; }

    .path { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 18px 20px 8px; margin-bottom: 20px; }
    .path-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
    .path-title { font-size: 18px; font-weight: 800; color: var(--text); }
    .path-cert { font-size: 11px; font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--accent);
      background: rgba(167,139,250,.12); border-radius: 5px; padding: 2px 8px; }
    .path-cap { font-size: 12.5px; color: var(--muted); margin-left: auto; }
    .path-desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0 0 14px; }

    /* stepped rail */
    .steps { position: relative; margin: 0 0 6px; padding-left: 26px; }
    .steps::before { content: ''; position: absolute; left: 9px; top: 6px; bottom: 30px;
      width: 2px; background: var(--border); }
    .step { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 0; cursor: pointer; }
    .step .dot { position: absolute; left: -22px; width: 18px; height: 18px; border-radius: 50%;
      background: #0b1426; border: 2px solid var(--border); display: flex; align-items: center;
      justify-content: center; font-size: 9px; font-weight: 800; color: var(--muted); }
    .step:hover .dot { border-color: var(--accent); color: var(--accent); }
    .step .dot.visited { border-color: var(--blue); color: var(--blue); }
    .step .dot.learned { background: var(--good); border-color: var(--good); color: #04231a; }
    .step .nm { font-size: 13.5px; color: var(--text); }
    .step:hover .nm { color: var(--accent); }
    .step .tag { font-size: 10.5px; color: var(--muted); margin-left: 6px; }
    .step .step-status { font-size: 11px; margin-left: 7px; }
    .step .step-status.learned { color: var(--good); }
    .step .step-status.visited { color: var(--blue); }
    .step .step-status.new { color: var(--muted); opacity: .5; }

    .step.capstone { margin-top: 4px; }
    .step.capstone .dot { background: var(--accent); border-color: var(--accent); color: #0b1020; }
    .step.capstone .nm { font-weight: 800; }
    .cap-badge { font-size: 10.5px; font-weight: 700; padding: 2px 9px; border-radius: 20px; margin-left: 8px; }
    .cap-badge.ready { color: var(--good); background: rgba(52,211,153,.14); }
    .cap-badge.prog { color: var(--warn); background: rgba(251,191,36,.14); }
    .cap-badge.new { color: var(--blue); background: rgba(34,211,238,.12); }
    .count-pill { font-size: 11px; color: var(--muted); }
  </style>

</head>

(function () {
  var root = document.getElementById('paths');
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function goto(file) {
    try { window.parent.postMessage({ type: 'dlh-navigate', file: file }, '*'); } catch (e) {}
    if (window.parent === window) window.location.href = file;
  }

  // Read once: app.html owns dlh_progress_v1, but shares localStorage with
  // this page (same origin, whether loaded standalone or in its iframe) —
  // no postMessage round-trip needed, just the same three-state vocabulary
  // app.html:refreshUI() paints in the sidebar (✓ learned / ● visited / ○ untouched).
  var progress = (function () { try { return JSON.parse(localStorage.getItem('dlh_progress_v1')) || {}; } catch (e) { return {}; } })();

  PATHS.forEach(function (p) {
    var hist = (window.DevHubQuiz && DevHubQuiz.loadHistory(p.examId)) || [];
    var best = hist.reduce(function (m, a) { return Math.max(m, a.pct); }, 0);
    var card = el('div', 'path');

    var head = el('div', 'path-head');
    head.appendChild(el('span', 'path-title', p.title));
    head.appendChild(el('span', 'path-cert', p.cert));
    head.appendChild(el('span', 'path-cap', p.steps.length + ' lessons → 1 exam'));
    card.appendChild(head);
    card.appendChild(el('p', 'path-desc', p.desc));

    var steps = el('div', 'steps');
    p.steps.forEach(function (s, i) {
      var step = el('div', 'step');
      var st = progress[s[0]]; // 'learned' | 'visited' | undefined
      step.appendChild(el('span', 'dot' + (st ? ' ' + st : ''), String(i + 1)));
      var nm = el('span', 'nm', s[1]);
      if (s[2]) nm.appendChild(el('span', 'tag', '· ' + s[2]));
      nm.appendChild(el('span', 'step-status ' + (st || 'new'), st === 'learned' ? '✓' : st === 'visited' ? '●' : '○'));
      step.appendChild(nm);
      step.addEventListener('click', function () { goto(s[0]); });
      steps.appendChild(step);
    });

    // capstone exam
    var status = best === 0 ? 'new' : (best >= passOf(p.examId) ? 'ready' : 'prog');
    var cap = el('div', 'step capstone');
    cap.appendChild(el('span', 'dot', '🎓'));
    var capnm = el('span', 'nm', 'Capstone exam: ' + p.title);
    var badgeTxt = status === 'ready' ? ('Best ' + best + '% — pass-ready') : status === 'prog' ? ('Best ' + best + '% — keep going') : 'Not attempted';
    capnm.appendChild(el('span', 'cap-badge ' + status, badgeTxt));
    cap.appendChild(capnm);
    cap.addEventListener('click', function () { goto(p.exam); });
    steps.appendChild(cap);

    card.appendChild(steps);
    root.appendChild(card);
  });

  // pass marks (kept in sync with each exam page)
  function passOf(id) {
    return { 'aws-practitioner': 70, 'aws-developer': 72, 'aws-sa-associate': 72, 'azure-developer': 72,
             'gcp-ace': 70, 'web-fundamentals': 70, 'data-science': 70, 'ai-engineering': 70,
             'java-ocp': 68, 'spring-professional': 76, 'dsa-interview': 70,
             'angular': 72, 'typescript': 70, 'identity-access': 75, 'git': 70,
             'docker': 70, 'kubernetes': 72, 'sql': 70, 'http-rest': 70 }[id] || 70;
  }
})();
</script>
