    :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#dd0031; --border:#334155; --blue:#22d3ee; }

    a.back { color:var(--blue); text-decoration:none; font-size:14px; }

<body class="track-angular">
<div class="container">
  <a class="back" href="angular-index.html">← Angular</a>
  <h1>Angular — Flashcards</h1>
  <p class="sub">Modern Angular (v17+): standalone components, signals, DI, RxJS, routing, and forms — the concepts you use building the day-job SPA. Front = term; back = what it does.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'angular-core', title: 'Angular', subtitle: 'name what it does', accent: '#dd0031',
  cards: [
    { front: 'Standalone component', hint: 'components', back: 'A component that declares its own imports and needs no NgModule. The modern default (standalone: true is implied in v19+) — simpler, tree-shakable, easier lazy loading.' },
    { front: 'Signal', hint: 'reactivity', back: 'A reactive value wrapper: signal(0) holds state, read it as count(). Reads track dependencies so the framework knows exactly what to update — fine-grained reactivity without Zone.js.' },
    { front: 'computed()', hint: 'reactivity', back: 'A derived signal recomputed lazily when its inputs change and memoized otherwise. Like a spreadsheet formula cell — declare the relationship, not the update.' },
    { front: 'effect()', hint: 'reactivity', back: 'Runs a side effect whenever the signals it reads change (logging, syncing to localStorage). For effects, not for deriving state — use computed() for that.' },
    { front: 'signal vs computed vs effect', hint: 'reactivity', back: 'signal = writable source. computed = read-only derived value. effect = react to changes with a side effect. Together they form the reactive graph.' },
    { front: 'Change detection', hint: 'rendering', back: 'The process of syncing the model to the DOM. Default strategy checks the whole component tree on any event; signals + OnPush narrow it to only what actually changed.' },
    { front: 'OnPush', hint: 'rendering', back: 'A change-detection strategy: re-check a component only when its @Input reference changes, an event fires in it, or a bound signal/observable emits. Big performance win.' },
    { front: 'Zone.js / zoneless', hint: 'rendering', back: 'Zone.js monkey-patches async APIs to know WHEN to run change detection. Signals enable zoneless mode (provideZonelessChangeDetection) — less magic, better perf, smaller bundle.' },
    { front: 'Dependency Injection', hint: 'di', back: 'Angular provides class instances via a hierarchical injector tree. Declare a dependency in the constructor or with inject(); Angular supplies the singleton from the right level.' },
    { front: 'inject()', hint: 'di', back: 'The function form of DI: const http = inject(HttpClient). Works in field initializers, functional guards, and interceptors where constructor injection is awkward.' },
    { front: 'providedIn: root', hint: 'di', back: 'Registers a service as an app-wide singleton that is tree-shakable (dropped if unused). The default for most services via @Injectable({ providedIn: \'root\' }).' },
    { front: 'input() / output()', hint: 'components', back: 'Signal-based component IO (v17.1+): input() reads parent-bound data as a signal; output() emits events. The modern replacement for @Input/@Output decorators.' },
    { front: '@if / @for / @switch', hint: 'templates', back: 'Built-in control flow (v17+) replacing *ngIf/*ngFor. @for REQUIRES a track expression for efficient list diffing. Faster and needs no CommonModule import.' },
    { front: 'Observable vs Promise', hint: 'rxjs', back: 'A Promise resolves once. An Observable is a stream of 0..n values over time, lazy (runs on subscribe), and cancellable (unsubscribe). HttpClient returns Observables.' },
    { front: 'switchMap vs mergeMap', hint: 'rxjs', back: 'Both flatten an Observable-of-Observables. switchMap CANCELS the previous inner stream on a new emit (perfect for type-ahead/search). mergeMap runs them all concurrently.' },
    { front: 'concatMap / exhaustMap', hint: 'rxjs', back: 'concatMap queues inner streams in order (one at a time). exhaustMap IGNORES new emissions while one is in flight (perfect for preventing double form submits).' },
    { front: 'async pipe', hint: 'rxjs', back: 'Subscribes to an Observable/Promise in the template ({{ data$ | async }}) and auto-unsubscribes on destroy. Prevents leaks — prefer it over manual subscribe in components.' },
    { front: 'takeUntilDestroyed()', hint: 'rxjs', back: 'Auto-completes a subscription when the component/injection context is destroyed (v16+). The modern way to avoid memory leaks for manual subscriptions.' },
    { front: 'Router & routes', hint: 'routing', back: 'Maps URL paths to components. Routes are config objects ([{ path, component }]); <router-outlet> renders the matched component. loadComponent lazy-loads it.' },
    { front: 'Functional route guard', hint: 'routing', back: 'A function (CanActivateFn) returning boolean/UrlTree to allow/redirect navigation. Use inject() inside it. Guards are UX gating — the server is the real authority.' },
    { front: 'Lazy loading', hint: 'routing', back: 'Defer loading a route bundle until navigated to via loadComponent/loadChildren — smaller initial bundle, faster first paint. Standard for feature areas.' },
    { front: 'HttpClient', hint: 'http', back: 'Angular HTTP service returning Observables. Provide it with provideHttpClient(); supports typed responses, interceptors, and easy testing via HttpTestingController.' },
    { front: 'HTTP interceptor', hint: 'http', back: 'A function in the request pipeline to attach auth headers, log, retry, or handle 401s globally. Functional interceptors (withInterceptors) are the modern form.' },
    { front: 'Reactive vs template-driven forms', hint: 'forms', back: 'Reactive: form model defined in TS (FormGroup/FormControl) — explicit, testable, scales. Template-driven: built from ngModel directives in the template — quick for simple forms.' },
    { front: 'FormGroup / FormControl / FormArray', hint: 'forms', back: 'FormControl = one field + its value/validation/state. FormGroup = a keyed set of controls. FormArray = a dynamic list of controls. Build forms by composing them.' },
    { front: 'Validators', hint: 'forms', back: 'Functions returning null (valid) or an error object. Built-ins: Validators.required, email, minLength. Custom validators and async validators (server checks) follow the same shape.' },
    { front: 'Content projection (ng-content)', hint: 'components', back: 'Lets a component render markup passed in by its parent (<ng-content>), like slots. Multiple slots via select=\"...\". The basis for reusable wrappers (cards, dialogs).' },
    { front: 'ViewChild / contentChild', hint: 'components', back: 'Query a child element/component from the view (viewChild) or projected content (contentChild). Signal-based query functions (v17.2+) return a signal you read reactively.' }
  ]
});
</script>
<script src="devhub-notebook.js"></script>
