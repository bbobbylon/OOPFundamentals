<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AWS Services — Flashcards</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#ff9900; --border:#334155; --blue:#22d3ee; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .container { max-width:760px; margin:0 auto; }
    a.back { color:var(--blue); text-decoration:none; font-size:14px; }
    h1 { margin:6px 0 4px; font-size:25px; color:var(--accent); }
    p.sub { margin:0 0 20px; color:var(--muted); line-height:1.6; }
  </style>
  <link rel="stylesheet" href="devhub.css" />
</head>
<body class="track-cloud">
<div class="container">
  <a class="back" href="aws-index.html">← AWS</a>
  <h1>AWS Services — Flashcards</h1>
  <p class="sub">The single biggest scorer on AWS exams is knowing which service does what. Drill the service → purpose mapping until it's instant.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'aws-services', title: 'AWS Services', subtitle: 'name the purpose of each service', accent: '#ff9900',
  cards: [
    { front: 'Amazon EC2', hint: 'compute', back: 'Virtual machines (instances) — resizable compute capacity you manage.' },
    { front: 'AWS Lambda', hint: 'compute', back: 'Serverless functions — run code with no servers to manage, pay per request/duration.' },
    { front: 'Amazon ECS / AWS Fargate', hint: 'compute', back: 'Managed container orchestration; Fargate runs containers serverlessly (no EC2 to manage).' },
    { front: 'AWS Elastic Beanstalk', hint: 'compute', back: 'PaaS — upload code and AWS provisions/scales the EC2, load balancer, and capacity for you.' },
    { front: 'Amazon S3', hint: 'storage', back: 'Object storage — virtually unlimited, 11 nines durability, accessed by key.' },
    { front: 'Amazon EBS', hint: 'storage', back: 'Block storage volumes attached to a single EC2 instance (like a virtual disk).' },
    { front: 'Amazon EFS', hint: 'storage', back: 'Managed NFS file system, mountable by many instances across AZs at once.' },
    { front: 'S3 Glacier / Deep Archive', hint: 'storage', back: 'Lowest-cost archival storage classes for rarely accessed data (retrieval in minutes–hours).' },
    { front: 'Amazon RDS', hint: 'database', back: 'Managed relational database (PostgreSQL, MySQL, etc.) with backups, Multi-AZ, replicas.' },
    { front: 'Amazon Aurora', hint: 'database', back: 'AWS’s high-performance MySQL/PostgreSQL-compatible DB; storage replicated across 3 AZs.' },
    { front: 'Amazon DynamoDB', hint: 'database', back: 'Managed NoSQL key-value/document DB with single-digit-millisecond performance at scale.' },
    { front: 'Amazon ElastiCache', hint: 'database', back: 'Managed in-memory cache (Redis/Memcached) for sub-millisecond reads.' },
    { front: 'Amazon Redshift', hint: 'analytics', back: 'Managed petabyte-scale data warehouse for analytics (OLAP).' },
    { front: 'Amazon VPC', hint: 'networking', back: 'Your logically isolated private network — subnets, route tables, gateways.' },
    { front: 'Amazon Route 53', hint: 'networking', back: 'Scalable DNS + domain registration + health-check-based routing.' },
    { front: 'Amazon CloudFront', hint: 'networking', back: 'CDN — caches content at edge locations near users to cut latency.' },
    { front: 'AWS Direct Connect', hint: 'networking', back: 'A dedicated private network link between on-premises and AWS.' },
    { front: 'Elastic Load Balancing', hint: 'networking', back: 'Distributes incoming traffic across healthy targets (ALB for HTTP, NLB for TCP/UDP).' },
    { front: 'AWS Global Accelerator', hint: 'networking', back: 'Routes TCP/UDP traffic over the AWS backbone to the nearest healthy Regional endpoint.' },
    { front: 'AWS IAM', hint: 'security', back: 'Identity & Access Management — who can do what; users, roles, policies.' },
    { front: 'AWS KMS', hint: 'security', back: 'Key Management Service — create/control encryption keys for data at rest.' },
    { front: 'AWS Secrets Manager', hint: 'security', back: 'Stores secrets encrypted with automatic rotation (e.g. DB passwords).' },
    { front: 'Amazon Cognito', hint: 'security', back: 'End-user sign-up/sign-in and identity federation, issuing JWT tokens.' },
    { front: 'AWS Shield', hint: 'security', back: 'Managed DDoS protection (Standard is free/automatic; Advanced adds more).' },
    { front: 'AWS WAF', hint: 'security', back: 'Web Application Firewall — filters layer-7 requests (SQLi, XSS, rate limits).' },
    { front: 'Amazon GuardDuty', hint: 'security', back: 'Intelligent threat detection from analyzing logs (VPC Flow, CloudTrail, DNS).' },
    { front: 'Amazon Inspector', hint: 'security', back: 'Automated vulnerability assessment for EC2 and container images.' },
    { front: 'Amazon Macie', hint: 'security', back: 'ML-based discovery and protection of sensitive data (PII) in S3.' },
    { front: 'AWS Artifact', hint: 'security', back: 'Self-service portal for AWS compliance reports (SOC, ISO, PCI).' },
    { front: 'Amazon CloudWatch', hint: 'management', back: 'Monitoring — metrics, logs, dashboards, and alarms for resources and apps.' },
    { front: 'AWS CloudTrail', hint: 'management', back: 'Records API calls / account activity for governance and auditing.' },
    { front: 'AWS Config', hint: 'management', back: 'Tracks resource configuration changes and evaluates compliance over time.' },
    { front: 'AWS CloudFormation', hint: 'management', back: 'Infrastructure as Code — provision AWS resources from declarative templates.' },
    { front: 'AWS Trusted Advisor', hint: 'management', back: 'Best-practice checks across cost, performance, security, fault tolerance, limits.' },
    { front: 'AWS Organizations', hint: 'management', back: 'Central multi-account management with consolidated billing and SCP guardrails.' },
    { front: 'Amazon SQS', hint: 'integration', back: 'Managed message queue — decouples producers and consumers (pull-based).' },
    { front: 'Amazon SNS', hint: 'integration', back: 'Pub/Sub notifications — push messages to many subscribers (often fans out to SQS).' },
    { front: 'Amazon Kinesis', hint: 'integration', back: 'Real-time streaming ingestion/processing with ordered, replayable records.' }
  ]
});
</script>
</body>
</html>
