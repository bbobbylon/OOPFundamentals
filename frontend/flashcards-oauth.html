<head>
  <meta charset="utf-8" />
  <title>OAuth 2.0 · OIDC · JWT — Flashcards</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#818cf8; --border:#334155; --blue:#22d3ee; }

    .container { max-width:760px; margin:0 auto; }
    a.back { color:var(--blue); text-decoration:none; font-size:14px; }
    h1 { margin:6px 0 4px; font-size:25px; color:var(--accent); }

<body class="track-identity">
<div class="container">
  <a class="back" href="app.html">← Hub</a>
  <h1>OAuth 2.0 · OIDC · JWT — Flashcards</h1>
  <p class="sub">The vocabulary of the CIAM day job. Grant types, token kinds, PKCE, claims, and the Ping/Entra terms — front = term; back = what it means and when it matters.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'oauth-oidc-jwt', title: 'OAuth 2.0 · OIDC · JWT', subtitle: 'name what it means', accent: '#818cf8',
  cards: [
    { front: 'OAuth 2.0', hint: 'framework', back: 'An authorization framework — it lets an app get delegated access to a resource on a user behalf, WITHOUT the user sharing their password. It is about access, not identity.' },
    { front: 'OpenID Connect (OIDC)', hint: 'framework', back: 'A thin identity layer ON TOP of OAuth 2.0. Adds the ID token and the /userinfo endpoint so the client learns WHO the user is, not just what it can access.' },
    { front: 'Access token vs ID token', hint: 'tokens', back: 'Access token = sent to APIs to authorize requests (audience = the API). ID token = proves the user authenticated, consumed by the CLIENT only (audience = the client). Never call an API with an ID token.' },
    { front: 'Authorization Code grant', hint: 'grant', back: 'The standard web/SPA flow: the user authenticates at the IdP, the app gets a short-lived CODE on the redirect, then exchanges it (server-to-server) for tokens. Tokens never ride in the browser URL.' },
    { front: 'PKCE', hint: 'grant', back: 'Proof Key for Code Exchange. The client sends a hashed code_challenge up front and the code_verifier at exchange. Stops a stolen authorization code from being redeemed. Mandatory for public clients (SPAs, mobile).' },
    { front: 'Client Credentials grant', hint: 'grant', back: 'Machine-to-machine: no user involved. The service authenticates with its own client_id/secret to get an access token. Used for backend-to-backend calls.' },
    { front: 'Refresh token', hint: 'tokens', back: 'A long-lived credential used to silently obtain new access tokens when they expire — no re-login. Must be stored securely; rotation + reuse-detection limits theft damage.' },
    { front: 'Implicit grant', hint: 'grant', back: 'Legacy SPA flow that returned tokens directly in the redirect fragment. DEPRECATED — superseded by Authorization Code + PKCE because tokens in the URL are exposed.' },
    { front: 'JWT', hint: 'token format', back: 'JSON Web Token: header.payload.signature, each Base64URL-encoded. Self-contained and signed — a resource server can validate it offline using the issuer public key.' },
    { front: 'JWT claims: iss, sub, aud', hint: 'claims', back: 'iss = issuer (who minted it). sub = subject (the user/principal id). aud = audience (who it is FOR — the API must check it is the intended recipient).' },
    { front: 'JWT claims: exp, iat, nbf', hint: 'claims', back: 'exp = expiry (reject after). iat = issued-at. nbf = not-before. A validator must check exp/nbf against the current clock (with small skew tolerance).' },
    { front: 'Signature: HS256 vs RS256', hint: 'crypto', back: 'HS256 = symmetric (one shared secret signs AND verifies). RS256 = asymmetric (private key signs, public key verifies). IdMs use RS256 so resource servers verify with a public key they never have to protect.' },
    { front: 'JWKS', hint: 'keys', back: 'JSON Web Key Set — the IdP public-key endpoint (e.g. /.well-known/jwks.json). Resource servers fetch and cache it to verify RS256 signatures; kid in the JWT header picks the right key.' },
    { front: 'kid (key id)', hint: 'keys', back: 'A header field naming WHICH key in the JWKS signed this token. Lets the IdP rotate keys: publish the new key, overlap, then retire the old — validators just look up by kid.' },
    { front: 'Scope', hint: 'authz', back: 'A space-delimited list of permissions the access token grants (e.g. read:users). Coarse-grained, requested by the client and consented by the user/admin.' },
    { front: 'Authority vs scope (Spring)', hint: 'authz', back: 'Spring maps scopes to SCOPE_* authorities and roles to ROLE_* authorities. @PreAuthorize(\"hasAuthority(\'SCOPE_read:users\')\") gates on the mapped value.' },
    { front: '401 vs 403', hint: 'errors', back: '401 Unauthorized = authentication failed/missing (no or bad token) — fix the token. 403 Forbidden = authenticated but not allowed (missing scope/role) — fix the claims/grants.' },
    { front: 'Authorization Server vs Resource Server', hint: 'roles', back: 'Authorization Server (the IdP) issues tokens. Resource Server (your API) validates them and serves protected data. Spring spring-boot-starter-oauth2-resource-server makes your API the latter.' },
    { front: 'Bearer token', hint: 'transport', back: 'A token where mere possession grants access — sent as Authorization: Bearer <token>. Because possession = access, it must travel over TLS and be short-lived.' },
    { front: 'Nonce', hint: 'OIDC', back: 'A random value the client puts in the auth request and checks in the returned ID token. Binds the token to this specific login, defending against replay.' },
    { front: 'state parameter', hint: 'CSRF', back: 'An opaque value round-tripped through the auth redirect to defend against CSRF and to restore app context after login. The client must verify it matches what it sent.' },
    { front: 'Token introspection', hint: 'validation', back: 'RFC 7662 — a resource server POSTs an opaque token to the IdP /introspect endpoint to ask if it is active. Used for reference (opaque) tokens; JWTs are usually validated locally instead.' },
    { front: 'On-Behalf-Of (OBO)', hint: 'flow', back: 'An API exchanges the user incoming token for a new token to call a DOWNSTREAM API as that same user. Common in Entra when a gateway must call Microsoft Graph on the user behalf.' },
    { front: 'Discovery document', hint: 'config', back: 'The /.well-known/openid-configuration JSON listing the issuer endpoints (authorization, token, jwks, userinfo). Clients bootstrap from one URL instead of hardcoding endpoints.' },
    { front: 'Audience validation', hint: 'security', back: 'The resource server MUST confirm the token aud claim names ITSELF. Skipping it lets a token minted for another API be replayed against yours — a classic misconfiguration.' },
    { front: 'Session vs token (stateful vs stateless)', hint: 'sessions', back: 'Server-side session = a cookie pointing to state stored on the server (revocable, but needs sticky/shared store). JWT = stateless, state lives in the signed token (scales, but hard to revoke before exp).' },
    { front: 'CIAM', hint: 'domain', back: 'Customer Identity & Access Management — identity for external users at scale (sign-up, social login, MFA, consent). Ping and Microsoft Entra are the products behind the day job.' },
    { front: 'IdP-initiated vs SP-initiated', hint: 'SSO', back: 'SP-initiated: the user starts at your app, which redirects to the IdP. IdP-initiated: the user starts at the IdP portal and launches into your app. SP-initiated is the safer default.' }
  ]
});
</script>
</body>
</html>
