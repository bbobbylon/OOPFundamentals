  <meta charset="utf-8" />
  <title>SQL — Flashcards</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#4f93c4; --border:#334155; --blue:#22d3ee; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .container { max-width:760px; margin:0 auto; }
    a.back { color:var(--blue); text-decoration:none; font-size:14px; }
    h1 { margin:6px 0 4px; font-size:25px; color:var(--accent); }
    p.sub { margin:0 0 20px; color:var(--muted); line-height:1.6; }
  </style>

<body class="track-sql">
<div class="container">
  <a class="back" href="app.html">← Hub</a>
  <h1>SQL — Flashcards</h1>
  <p class="sub">Joins, aggregation, keys, indexes, transactions, and the normalization rules. Front = concept or clause; back = what it does and the common trap.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'sql-core', title: 'SQL', subtitle: 'name what it does', accent: '#4f93c4',
  cards: [
    { front: 'INNER JOIN', hint: 'joins', back: 'Returns only rows with a match in BOTH tables. The most common join — rows with no counterpart on either side are dropped.' },
    { front: 'LEFT (OUTER) JOIN', hint: 'joins', back: 'All rows from the LEFT table, plus matches from the right (NULLs where none). Use it to keep the left side even when there is no related row — then WHERE right.id IS NULL finds the orphans.' },
    { front: 'CROSS JOIN', hint: 'joins', back: 'The Cartesian product — every left row paired with every right row. Often appears by accident when a join condition is missing (runaway row counts).' },
    { front: 'WHERE vs HAVING', hint: 'filtering', back: 'WHERE filters individual rows BEFORE grouping. HAVING filters GROUPS after aggregation (e.g. HAVING COUNT(*) > 5). You cannot use an aggregate in WHERE.' },
    { front: 'GROUP BY', hint: 'aggregation', back: 'Collapses rows into groups so aggregates (COUNT, SUM, AVG) compute per group. Every non-aggregated SELECT column must appear in GROUP BY (in standard SQL).' },
    { front: 'Aggregate functions', hint: 'aggregation', back: 'COUNT, SUM, AVG, MIN, MAX operate over a set of rows. COUNT(*) counts rows; COUNT(col) ignores NULLs — a frequent source of off-by-some bugs.' },
    { front: 'Logical query order', hint: 'concepts', back: 'SQL executes FROM/JOIN -> WHERE -> GROUP BY -> HAVING -> SELECT -> ORDER BY -> LIMIT. That is why a SELECT alias cannot be used in WHERE but can in ORDER BY.' },
    { front: 'NULL semantics', hint: 'concepts', back: 'NULL = unknown. NULL = NULL is NOT true — use IS NULL / IS NOT NULL. Any arithmetic or comparison with NULL yields NULL, which filters the row out.' },
    { front: 'Primary key', hint: 'keys', back: 'Uniquely identifies each row; implies NOT NULL + UNIQUE and creates a clustered/index structure. One per table.' },
    { front: 'Foreign key', hint: 'keys', back: 'A column referencing another table primary key, enforcing referential integrity. ON DELETE CASCADE/RESTRICT/SET NULL controls what happens to children when a parent is deleted.' },
    { front: 'UNIQUE vs PRIMARY KEY', hint: 'keys', back: 'Both enforce uniqueness, but a table has one PRIMARY KEY (NOT NULL) and may have many UNIQUE constraints (which can allow a NULL, depending on the engine).' },
    { front: 'Index', hint: 'indexes', back: 'A sorted side structure (usually a B-tree) that turns an O(n) table scan into an O(log n) lookup for WHERE/JOIN/ORDER BY on the indexed columns — at the cost of slower writes + storage.' },
    { front: 'Composite index & leftmost prefix', hint: 'indexes', back: 'An index on (a, b, c) can serve queries filtering a, or a+b, or a+b+c — but NOT b alone. Column order matters; put the most selective/most-filtered column first.' },
    { front: 'Covering index', hint: 'indexes', back: 'An index that contains every column a query needs, so the engine answers from the index alone without touching the table (index-only scan). A big read win.' },
    { front: 'EXPLAIN / query plan', hint: 'indexes', back: 'Shows HOW the engine will run a query. Seq/Table SCAN = reading everything (often bad on big tables); Index SEEK/SCAN = using an index. The tool for diagnosing slow queries.' },
    { front: 'Why an index is not used', hint: 'indexes', back: 'A function or implicit cast on the indexed column (WHERE LOWER(email)=...), a leading wildcard (LIKE %x), low selectivity, or stale statistics can all force a full scan.' },
    { front: 'Transaction / ACID', hint: 'transactions', back: 'A unit of work that is Atomic (all or nothing), Consistent (constraints hold), Isolated (concurrent txns do not corrupt each other), Durable (committed = survives a crash).' },
    { front: 'COMMIT vs ROLLBACK', hint: 'transactions', back: 'COMMIT makes all changes in the transaction permanent and visible. ROLLBACK discards them, returning to the state at BEGIN. An error mid-transaction should roll back.' },
    { front: 'Isolation levels', hint: 'transactions', back: 'Read Uncommitted -> Read Committed -> Repeatable Read -> Serializable. Higher levels prevent more anomalies (dirty/non-repeatable/phantom reads) but reduce concurrency.' },
    { front: 'Deadlock', hint: 'transactions', back: 'Two transactions each hold a lock the other needs — neither can proceed. The engine detects it and kills one (the victim). Reduce by locking objects in a consistent order.' },
    { front: '1NF', hint: 'normalization', back: 'First Normal Form: atomic column values (no repeating groups or arrays in a cell) and a key. One value per cell.' },
    { front: '2NF', hint: 'normalization', back: 'Second Normal Form: 1NF + every non-key column depends on the WHOLE composite key, not just part of it. Removes partial dependencies.' },
    { front: '3NF', hint: 'normalization', back: 'Third Normal Form: 2NF + no transitive dependencies (non-key columns must not depend on other non-key columns). The usual target for OLTP schemas.' },
    { front: 'Denormalization', hint: 'normalization', back: 'Deliberately adding redundancy (duplicated columns, precomputed totals) to speed reads — trading write complexity and integrity risk for query performance. Common in reporting/analytics.' },
    { front: 'CTE (WITH)', hint: 'advanced', back: 'A named, inline subquery (WITH x AS (...)) that makes complex queries readable and can be referenced multiple times. RECURSIVE CTEs walk hierarchies/graphs.' },
    { front: 'Window function', hint: 'advanced', back: 'Computes across a set of rows RELATED to the current row WITHOUT collapsing them: ROW_NUMBER(), RANK(), SUM() OVER (PARTITION BY ...). Aggregates while keeping every row.' },
    { front: 'Subquery vs JOIN', hint: 'advanced', back: 'Often interchangeable; the planner may execute them the same way. Correlated subqueries (referencing the outer row) can run per-row — a JOIN or window function is frequently faster.' },
    { front: 'TRUNCATE vs DELETE', hint: 'DML', back: 'DELETE removes rows one by one (logged, fires triggers, can have WHERE, rollback-able). TRUNCATE drops all rows fast by deallocating pages — minimal logging, resets identity, no WHERE.' }
  ]
});
</script>
<script src="devhub-notebook.js"></script>

</body>
</html>
