<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Big-O Cheat Sheet — Flashcards</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#f59e0b; --border:#334155; --blue:#22d3ee; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .container { max-width:760px; margin:0 auto; }
    a.back { color:var(--blue); text-decoration:none; font-size:14px; }
    h1 { margin:6px 0 4px; font-size:25px; color:var(--accent); }
    p.sub { margin:0 0 20px; color:var(--muted); line-height:1.6; }
  </style>
  <link rel="stylesheet" href="devhub.css" />
</head>
<body class="track-data">
<div class="container">
  <a class="back" href="ds-index.html">← Data Structures</a>
  <h1>Big-O Cheat Sheet — Flashcards</h1>
  <p class="sub">The complexities every interviewer expects you to know cold. Front = operation; back = time complexity and why.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'bigo', title: 'Big-O Cheat Sheet', subtitle: 'name the complexity', accent: '#f59e0b',
  cards: [
    { front: 'Array — access by index', hint: 'array', back: 'O(1) — direct addressing.' },
    { front: 'Array — search (unsorted)', hint: 'array', back: 'O(n) — must scan.' },
    { front: 'Array — insert/delete at middle', hint: 'array', back: 'O(n) — shift elements.' },
    { front: 'Dynamic array — append (amortized)', hint: 'array', back: 'O(1) amortized — occasional O(n) resize spread out.' },
    { front: 'Linked list — access by position', hint: 'list', back: 'O(n) — no random access; traverse from head.' },
    { front: 'Linked list — insert/delete (given the node)', hint: 'list', back: 'O(1) — just relink pointers.' },
    { front: 'Hash table — insert / lookup (average)', hint: 'hash', back: 'O(1) average; O(n) worst case with many collisions.' },
    { front: 'Stack / Queue — push, pop, enqueue, dequeue', hint: 'stack', back: 'O(1) — operate at the end(s).' },
    { front: 'Binary search (sorted array)', hint: 'search', back: 'O(log n) — halve the range each step.' },
    { front: 'Balanced BST — search / insert / delete', hint: 'tree', back: 'O(log n) — height stays ~log n.' },
    { front: 'Unbalanced (skewed) BST — search', hint: 'tree', back: 'O(n) — degenerates to a linked list.' },
    { front: 'Binary heap — insert / extract-min', hint: 'heap', back: 'O(log n) — sift up/down the tree height.' },
    { front: 'Binary heap — peek (min/max)', hint: 'heap', back: 'O(1) — it’s at the root.' },
    { front: 'Build a heap from n items', hint: 'heap', back: 'O(n) — bottom-up heapify (not O(n log n)).' },
    { front: 'Trie — search / insert a word of length L', hint: 'trie', back: 'O(L) — one step per character, independent of dictionary size.' },
    { front: 'Bubble / Insertion / Selection sort', hint: 'sort', back: 'O(n²) average and worst.' },
    { front: 'Merge sort', hint: 'sort', back: 'O(n log n) always; stable; O(n) extra space.' },
    { front: 'Quicksort', hint: 'sort', back: 'O(n log n) average, O(n²) worst (bad pivots); in place.' },
    { front: 'Heap sort', hint: 'sort', back: 'O(n log n) worst case; in place; not stable.' },
    { front: 'Counting / Radix sort', hint: 'sort', back: 'O(n + k) / O(d·n) — non-comparison, beats n log n for bounded integers.' },
    { front: 'BFS / DFS on a graph', hint: 'graph', back: 'O(V + E) — visit each vertex and edge once.' },
    { front: 'Dijkstra (with a binary heap)', hint: 'graph', back: 'O((V + E) log V).' },
    { front: 'Quickselect (k-th smallest)', hint: 'select', back: 'O(n) average, O(n²) worst — partition into one side only.' },
    { front: 'Naive recursive Fibonacci', hint: 'recursion', back: 'O(2ⁿ) — exponential from recomputed subproblems (fix with DP → O(n)).' },
    { front: 'Space cost of recursion depth d', hint: 'space', back: 'O(d) — one stack frame per pending call.' },
    { front: 'Generating all subsets of n items', hint: 'combinatorics', back: 'O(2ⁿ) — each item in or out.' },
    { front: 'Generating all permutations of n items', hint: 'combinatorics', back: 'O(n!) — factorial growth.' }
  ]
});
</script>
</body>
</html>
