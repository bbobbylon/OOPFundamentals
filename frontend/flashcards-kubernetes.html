<body class="track-kubernetes">
<div class="container">
  <a class="back" href="app.html">← Hub</a>
  <h1>Kubernetes — Flashcards</h1>
  <p class="sub">The objects and the control-plane vocabulary: pods, controllers, services, config, and scaling. Front = term or kubectl command; back = what it is and when you reach for it.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'kubernetes-core', title: 'Kubernetes', subtitle: 'name what it is', accent: '#326ce5',
  cards: [
    { front: 'Pod', hint: 'core', back: 'The smallest deployable unit — one or more containers that share a network (IP/port space) and storage. You rarely create pods directly; a controller manages them.' },
    { front: 'Node', hint: 'core', back: 'A worker machine (VM or physical) that runs pods. Each node runs the kubelet (agent), a container runtime, and kube-proxy. The control plane schedules pods onto nodes.' },
    { front: 'Control plane', hint: 'core', back: 'The brain: API server (front door), etcd (state store), scheduler (places pods), and controller-manager (reconciles desired vs actual). You declare desired state; it converges reality to it.' },
    { front: 'Declarative model / reconciliation', hint: 'concepts', back: 'You declare DESIRED state in YAML; controllers continuously reconcile actual toward it. Delete a pod and the controller recreates it — the core idea behind self-healing.' },
    { front: 'ReplicaSet', hint: 'controllers', back: 'Keeps a specified number of identical pod replicas running. Usually managed by a Deployment rather than used directly.' },
    { front: 'Deployment', hint: 'controllers', back: 'Manages ReplicaSets to give you declarative updates: rolling deploys, rollbacks, and scaling. The default way to run a stateless app.' },
    { front: 'Rolling update & rollback', hint: 'controllers', back: 'A Deployment replaces pods gradually (maxSurge/maxUnavailable) so there is no downtime. kubectl rollout undo reverts to the previous ReplicaSet if a release goes bad.' },
    { front: 'StatefulSet', hint: 'controllers', back: 'For stateful apps needing stable network identity and stable per-pod storage (e.g. databases). Pods get ordered, sticky names (db-0, db-1) and their own PVCs.' },
    { front: 'DaemonSet', hint: 'controllers', back: 'Runs one copy of a pod on EVERY node (or a subset) — used for node-level agents like log collectors, monitoring, or a CNI.' },
    { front: 'Job vs CronJob', hint: 'controllers', back: 'Job runs a pod to COMPLETION (batch work). CronJob runs Jobs on a schedule (like cron). For tasks, not long-running services.' },
    { front: 'Service (ClusterIP)', hint: 'networking', back: 'A stable virtual IP + DNS name load-balancing across the pods matching its selector. ClusterIP (default) is reachable only inside the cluster. Pods come and go; the Service endpoint is stable.' },
    { front: 'Service: NodePort vs LoadBalancer', hint: 'networking', back: 'NodePort exposes the service on a port of every node. LoadBalancer provisions a cloud load balancer with an external IP. ClusterIP is internal-only.' },
    { front: 'Ingress', hint: 'networking', back: 'HTTP(S) routing into the cluster: host/path rules, TLS termination — one entry point fanning out to many services. Needs an ingress controller (nginx, Traefik) to do the work.' },
    { front: 'Service discovery (DNS)', hint: 'networking', back: 'Every Service gets a DNS name: <service>.<namespace>.svc.cluster.local. Pods resolve other services by name — no hardcoded IPs.' },
    { front: 'ConfigMap', hint: 'config', back: 'Stores non-secret config (key/value, files) injected as env vars or mounted volumes. Decouples configuration from the image so the same image runs in any environment.' },
    { front: 'Secret', hint: 'config', back: 'Like a ConfigMap but for sensitive data (base64-encoded, not encrypted by default). Enable encryption-at-rest + RBAC; prefer an external secret store for real secrets.' },
    { front: 'Namespace', hint: 'org', back: 'A virtual cluster for grouping/isolating resources (team, env). Scopes names, quotas, and RBAC. default, kube-system, kube-public exist out of the box.' },
    { front: 'Labels & selectors', hint: 'org', back: 'Labels are key/value tags on objects; selectors match them. The glue that connects a Service to its pods and a Deployment to its ReplicaSet.' },
    { front: 'requests vs limits', hint: 'resources', back: 'requests = guaranteed CPU/memory used for SCHEDULING. limits = the hard ceiling. Exceed a memory limit and the pod is OOMKilled; CPU over-limit is throttled.' },
    { front: 'Liveness vs readiness probe', hint: 'health', back: 'Liveness: is it alive? Fail = restart the container. Readiness: is it ready for traffic? Fail = remove from Service endpoints (no restart). Different jobs — set both.' },
    { front: 'HPA (HorizontalPodAutoscaler)', hint: 'scaling', back: 'Automatically scales the replica count up/down based on metrics (CPU, memory, custom). Reacts to load so you do not hand-tune replicas.' },
    { front: 'kubectl get / describe', hint: 'cli', back: 'get lists resources (kubectl get pods -n ns). describe shows full detail + the EVENTS at the bottom — the first place to look when a pod will not start.' },
    { front: 'kubectl apply -f', hint: 'cli', back: 'Declaratively create/update resources from YAML, tracking changes for diffs. The GitOps-friendly verb (vs imperative create/edit).' },
    { front: 'kubectl logs / exec', hint: 'cli', back: 'logs <pod> streams container output (-f to follow, --previous for a crashed instance). exec -it <pod> -- sh drops you into the container to debug.' },
    { front: 'CrashLoopBackOff', hint: 'debug', back: 'A pod keeps crashing and Kubernetes restarts it with growing back-off delay. Check kubectl logs --previous and describe events — usually a bad config, missing dep, or failed probe.' },
    { front: 'ImagePullBackOff', hint: 'debug', back: 'Kubernetes cannot pull the image — wrong tag, private registry without imagePullSecrets, or registry down. describe the pod to see the exact pull error.' },
    { front: 'Helm chart', hint: 'packaging', back: 'A templated, versioned package of Kubernetes manifests with values.yaml for per-environment overrides. helm install/upgrade/rollback manages releases — the de-facto package manager.' }
  ]
});
</script>
