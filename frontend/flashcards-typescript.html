<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>TypeScript — Flashcards</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#3178c6; --border:#334155; --blue:#22d3ee; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .container { max-width:760px; margin:0 auto; }
    a.back { color:var(--blue); text-decoration:none; font-size:14px; }
    h1 { margin:6px 0 4px; font-size:25px; color:var(--accent); }
    p.sub { margin:0 0 20px; color:var(--muted); line-height:1.6; }
  </style>

<body class="track-ts">
<div class="container">
  <a class="back" href="typescript-index.html">← TypeScript</a>
  <h1>TypeScript — Flashcards</h1>
  <p class="sub">The type system you use every day in Angular, plus the type-level toolkit. Front = keyword or concept; back = what it does and the gotcha.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'typescript-core', title: 'TypeScript', subtitle: 'name what it does', accent: '#3178c6',
  cards: [
    { front: 'Structural typing', hint: 'system', back: 'TypeScript checks compatibility by SHAPE, not by name (duck typing). If an object has the required members, it fits the type — no explicit implements needed.' },
    { front: 'type vs interface', hint: 'declarations', back: 'Both describe object shapes. interface supports declaration merging and is idiomatic for public object/class contracts. type also does unions, intersections, tuples, and mapped/conditional types.' },
    { front: 'any vs unknown', hint: 'top types', back: 'any disables type checking (escape hatch — avoid). unknown is the safe top type: you can assign anything TO it, but must narrow before you use it. Prefer unknown.' },
    { front: 'never', hint: 'bottom type', back: 'The type with no values — returned by functions that never return (throw/infinite loop) and the result of an impossible narrowing. Used for exhaustiveness checks in switch.' },
    { front: 'void', hint: 'types', back: 'The absence of a return value. A void-returning function type can be satisfied by a function returning anything (the return is just ignored) — handy for callbacks.' },
    { front: 'Union type (A | B)', hint: 'composition', back: 'A value that is one of several types. You can only access members common to ALL members until you narrow it down to a specific one.' },
    { front: 'Intersection type (A & B)', hint: 'composition', back: 'A value that is ALL of several types at once — it has every member of each. Used to combine/mix-in shapes.' },
    { front: 'Literal type', hint: 'types', back: 'A type that is one exact value: \"GET\" | \"POST\", or 200. Combined with unions, models a fixed set of allowed values (safer than string).' },
    { front: 'Type narrowing', hint: 'narrowing', back: 'Control-flow analysis shrinks a union based on checks: typeof, instanceof, in, truthiness, equality. Inside the branch, TS knows the more specific type.' },
    { front: 'Type guard (x is T)', hint: 'narrowing', back: 'A function returning a type predicate (arg is Cat). When it returns true, TS narrows the argument to T in the calling branch — custom, reusable narrowing.' },
    { front: 'Discriminated union', hint: 'narrowing', back: 'A union of object types sharing a literal tag field (kind: \"circle\" | \"square\"). switch on the tag narrows perfectly and enables exhaustiveness via never.' },
    { front: 'Generics <T>', hint: 'generics', back: 'Type parameters that let a function/class work over many types while preserving the relationship between inputs and outputs (identity<T>(x: T): T). Reuse without losing type info.' },
    { front: 'Generic constraint (extends)', hint: 'generics', back: '<T extends { id: number }> restricts T to types with the required shape, so you can safely access those members inside the generic.' },
    { front: 'keyof', hint: 'type-level', back: 'Produces a union of an object type keys: keyof { a:1; b:2 } is \"a\" | \"b\". The basis for type-safe property access helpers.' },
    { front: 'Indexed access (T[K])', hint: 'type-level', back: 'Looks up the type of a property: Person[\"age\"] is number. Combined with keyof, lets a generic getter return the exact value type.' },
    { front: 'Mapped type', hint: 'type-level', back: '{ [K in keyof T]: ... } transforms each property of T — the machinery behind Partial, Readonly, Pick. Modifiers ?, readonly, and - add/remove them.' },
    { front: 'Conditional type', hint: 'type-level', back: 'T extends U ? X : Y — chooses a type based on a relationship. With infer it can extract a piece (e.g. the element type of an array).' },
    { front: 'infer', hint: 'type-level', back: 'Used inside a conditional type to capture a type into a variable: T extends Array<infer E> ? E : never extracts the element type. The engine behind ReturnType, Awaited, etc.' },
    { front: 'Partial<T> / Required<T>', hint: 'utility', back: 'Partial makes every property optional (great for update DTOs); Required makes every property mandatory. Both are mapped types over T.' },
    { front: 'Pick<T,K> / Omit<T,K>', hint: 'utility', back: 'Pick keeps only the listed keys; Omit removes them. Build a narrower view of a type without redefining it (e.g. a public DTO from an entity).' },
    { front: 'Record<K,V>', hint: 'utility', back: 'An object type with keys K and values V: Record<string, User> is a dictionary of users. Cleaner than { [k: string]: User }.' },
    { front: 'Readonly<T> / as const', hint: 'utility', back: 'Readonly<T> marks all properties immutable. as const freezes a literal to its narrowest readonly type (great for config objects and tuples).' },
    { front: 'ReturnType / Parameters / Awaited', hint: 'utility', back: 'ReturnType<F> = a function return type; Parameters<F> = its arg tuple; Awaited<T> = the type a Promise resolves to. Conditional+infer utilities.' },
    { front: 'Optional ? vs undefined', hint: 'gotchas', back: 'name?: string means the property may be ABSENT (type string | undefined). With strict, you must handle the undefined case before using it.' },
    { front: 'Non-null assertion (!)', hint: 'gotchas', back: 'value! tells the compiler value is not null/undefined — it silences the check WITHOUT a runtime guarantee. A lie to the type system; prefer real narrowing.' },
    { front: 'strict mode', hint: 'config', back: 'Enables strictNullChecks, noImplicitAny, strictFunctionTypes, etc. The settings that make TypeScript actually catch bugs — turn it on.' },
    { front: 'Type vs value space', hint: 'concepts', back: 'TypeScript has two namespaces: types (erased at compile time) and values (run at runtime). class and enum create both; interface/type exist only at compile time.' },
    { front: 'Type assertion (as)', hint: 'gotchas', back: 'x as T tells the compiler to TRUST you about the type — no runtime check or conversion. Different from a cast; misuse hides real bugs. Validate at boundaries instead.' }
  ]
});
</script>
</body>
</html>
