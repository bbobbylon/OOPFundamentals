<body class="track-data-science">
<div class="container">
  <a class="back" href="app.html">← Hub</a>
  <h1>Data Science &amp; ML — Flashcards</h1>
  <p class="sub">NumPy/pandas, data cleaning &amp; EDA, visualization, ML fundamentals, regression &amp; classification, model evaluation, clustering &amp; PCA, and neural networks/PyTorch. Front = term or concept; back = what it means and the gotcha that trips people up.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'data-science-core', title: 'Data Science & ML', subtitle: 'name what it does', accent: '#4d77cf',
  cards: [
    { front: 'Vectorization (NumPy)', hint: 'numpy', back: 'Expressing an operation as one call over a whole array instead of a Python for-loop. Runs as compiled C code, avoiding per-element interpreter overhead — the speedup grows fast with array size.' },
    { front: 'View vs copy (NumPy)', hint: 'numpy', back: 'Basic slicing returns a VIEW sharing the same memory — mutating it mutates the original. Fancy indexing or .copy() returns an independent COPY. A very common source of subtle bugs.' },
    { front: '.loc vs .iloc (pandas)', hint: 'pandas', back: '.loc selects by LABEL (index/column name). .iloc selects by INTEGER POSITION. They diverge once the index isn\'t the default 0..n-1 range — e.g. after filtering.' },
    { front: 'groupby (split-apply-combine)', hint: 'pandas', back: 'Split the DataFrame into groups by key, apply an aggregation independently to each group, then combine the per-group results back into one output.' },
    { front: 'MCAR / MAR / MNAR', hint: 'cleaning', back: 'Missing Completely At Random: unrelated to any variable. Missing At Random: depends on other OBSERVED variables. Missing Not At Random: depends on the missing value itself — the hardest to correct for.' },
    { front: 'IQR outlier fence', hint: 'cleaning', back: 'Flag anything below Q1 − 1.5×IQR or above Q3 + 1.5×IQR. Quartile-based, so unlike mean/std-based z-score, one extreme point doesn\'t drag the fence around.' },
    { front: 'Mean imputation risk', hint: 'cleaning', back: 'Filling every missing value with the column mean collapses them all to one identical number — artificially shrinks variance and can distort correlations with other columns.' },
    { front: 'Matplotlib Figure vs Axes', hint: 'viz', back: 'Figure = the overall canvas/window. Axes = one actual plot (x/y axes) placed inside it. A Figure commonly holds a grid of several Axes — almost every plot call is a method on an Axes.' },
    { front: 'Choosing a chart type', hint: 'viz', back: 'Distribution shape of one continuous variable → histogram. Comparison across categories → bar chart. Trend over time → line chart. Relationship between two continuous variables → scatter plot.' },
    { front: 'Why avoid many-slice pie charts', hint: 'viz', back: 'Human perception compares BAR LENGTH far more accurately than the angle/area of a pie slice — past ~5-6 categories, thin slices become hard to distinguish and rank. Use a sorted bar chart instead.' },
    { front: 'Train / validation / test split', hint: 'ml', back: 'Train fits parameters. Validation tunes hyperparameters/model choice. Test is touched once at the very end for an unbiased final estimate — reusing test for tuning quietly turns it into another validation set.' },
    { front: 'Overfitting vs underfitting', hint: 'ml', back: 'Overfitting: great training score, weak test score — memorized noise specific to training data. Underfitting: weak on BOTH — model too simple to capture the real pattern.' },
    { front: 'Bias-variance tradeoff', hint: 'ml', back: 'High bias = too simple, systematically misses the pattern (underfitting). High variance = too sensitive to the specific training sample, fits noise (overfitting). Reducing one often raises the other.' },
    { front: 'Supervised vs unsupervised', hint: 'ml', back: 'Supervised: trains on labeled input→output pairs (regression, classification). Unsupervised: finds structure in unlabeled data (clustering, dimensionality reduction).' },
    { front: 'Linear vs logistic regression', hint: 'models', back: 'Linear regression outputs any real number. Logistic regression passes that through the sigmoid function, squashing it into a valid (0,1) class probability — why it, not linear regression, is used for classification.' },
    { front: 'Gini impurity', hint: 'models', back: 'A decision tree\'s measure of class mixture at a node — near 0 means the node is almost pure (one dominant class). The tree greedily picks the split that most reduces it at each step.' },
    { front: 'Random forest (bagging)', hint: 'models', back: 'Many trees, each trained on a bootstrapped sample with a random feature subset per split, then averaged/voted together. Decorrelating the trees is what makes individual overfitting cancel out.' },
    { front: 'Accuracy vs interpretability tradeoff', hint: 'models', back: 'Single decision trees and linear/logistic regression are the most explainable. Ensembles (random forests) trade some of that away for accuracy. Deep neural nets are typically the least directly interpretable.' },
    { front: 'Confusion matrix cells', hint: 'eval', back: 'True positive / true negative = correct. False positive = predicted positive, actually negative. False negative = predicted negative, actually positive. Every downstream metric is built from these four counts.' },
    { front: 'Precision vs recall', hint: 'eval', back: 'Precision: of what was flagged positive, how much was right. Recall: of all actual positives, how many were found. Raising one via threshold tuning typically lowers the other.' },
    { front: 'ROC-AUC', hint: 'eval', back: 'Summarizes ranking quality across every decision threshold into one number. 1.0 = perfect ranker. 0.5 = no better than random guessing (the diagonal line on the ROC curve).' },
    { front: 'k-fold cross-validation', hint: 'eval', back: 'Rotates which slice of the data serves as the held-out fold across k rounds, averaging the k scores — far less sensitive to one lucky/unlucky split than a single train/test split, especially on small datasets.' },
    { front: 'K-means: assign / update', hint: 'clustering', back: 'Repeats two steps until convergence: assign each point to its nearest centroid, then move each centroid to the mean of the points now assigned to it. Not guaranteed to find the global best clustering.' },
    { front: 'Elbow method', hint: 'clustering', back: 'Plots within-cluster variance (inertia) against increasing k, looking for the point where the improvement flattens — a common (imperfect) heuristic for choosing k, since k must be chosen up front.' },
    { front: 'PCA (dimensionality reduction)', hint: 'clustering', back: 'Finds new axes (principal components), ordered by how much variance each captures, and projects onto the top few. Components are LINEAR COMBINATIONS of original features, not a subset of them.' },
    { front: 'Why nonlinear activation functions', hint: 'neural-nets', back: 'A stack of purely linear layers mathematically collapses into one equivalent linear transformation, no matter how deep. Nonlinearity (ReLU, sigmoid) is what lets depth actually add representational power.' },
    { front: 'Gradient descent', hint: 'neural-nets', back: 'Repeatedly nudges each parameter opposite the gradient (steepest-increase direction) of the loss, scaled by a learning rate. Too large a rate overshoots; too small crawls.' },
    { front: 'Backpropagation', hint: 'neural-nets', back: 'Applies the chain rule backward from the output loss through every layer, efficiently computing each weight\'s gradient. The mechanism gradient descent needs on every training step — without it, per-weight gradients would be computationally prohibitive.' },
    { front: 'CNNs vs RNNs', hint: 'deep-learning', back: 'CNNs: convolutional filters detect local spatial patterns (edges/textures) regardless of position — the fit for images. RNNs/LSTM: process a sequence step by step, carrying a hidden state forward — the fit for text/time series.' },
    { front: 'optimizer.zero_grad() (PyTorch)', hint: 'deep-learning', back: 'PyTorch accumulates gradients into .grad on every .backward() call by design. Skipping zero_grad() silently trains on gradients wrongly summed across iterations — no crash, just quietly wrong training.' }
  ]
});
</script>
