<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- The Dev Hub lives in app.html. This page just forwards there. -->
  <!-- IMPORTANT: if we're loaded INSIDE the hub's own viewer iframe (e.g. a page's
       "← All Visualizers" link points here), redirecting *this* frame to app.html
       would render the whole hub inside itself ("page within a page"). So break OUT
       to the TOP window instead. Standalone, top === self, so it just forwards. -->
  <link rel="canonical" href="app.html" />
  <title>DevHub — redirecting…</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #0f172a; color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
    }
    a { color: #22d3ee; }
    .note { font-size: 12px; color: #64748b; margin-top: 10px; }
  </style>
  <script>
    (function () {
      // Prefer the top window so we never nest the hub inside its own iframe.
      var win = window;
      try { if (window.top && window.top !== window.self) win = window.top; } catch (e) { /* cross-origin: stay self */ }
      win.location.replace('app.html');
    })();
  </script>
</head>
<body>
  <div>
    <p>Redirecting to the <a href="app.html" target="_top">Dev Hub</a>…</p>
    <p class="note">If you're not redirected, click the link above.
      (The old landing page is archived at <a href="index-legacy.html" target="_top">index-legacy.html</a>.)</p>
  </div>
</body>
</html>
