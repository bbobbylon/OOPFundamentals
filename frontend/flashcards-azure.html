  <h1>Azure Services — Flashcards</h1>
  <p class="sub">The AZ-204 core: ARM &amp; RBAC, App Service, Functions, containers, Blob Storage, Cosmos DB, Key Vault and managed identities. Front = service or concept; back = what it is and the exam-relevant edge.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'azure-core', title: 'Azure Services', subtitle: 'name what it does', accent: '#0078d4',
  cards: [
    { front: 'Azure Resource Manager (ARM)', hint: 'core', back: 'The single control plane every portal/CLI/SDK management call goes through: authenticate with Entra ID → authorize via RBAC → dispatch to the resource provider. One front door, one audit trail.' },
    { front: 'Resource group', hint: 'core', back: 'Logical container for resources that share a lifecycle. Delete the group = delete everything in it; RBAC roles and tags applied at group scope flow down to members.' },
    { front: 'RBAC role assignment', hint: 'security', back: 'principal + role definition + scope. Roles are additive allow-lists of actions; no assignment covering the action at the scope → ARM answers 403. Management roles (Contributor) do NOT grant data-plane access.' },
    { front: 'Bicep', hint: 'IaC', back: 'Azure-native declarative language that compiles to ARM JSON. Idempotent: redeploying the same file converges to the same state, and ARM works out resource dependency order.' },
    { front: 'Entra ID (was Azure AD)', hint: 'identity', back: 'The identity provider behind everything: issues the OAuth tokens users, service principals, and managed identities present to ARM and to data planes (Key Vault, Blob, Cosmos).' },
    { front: 'App Service plan', hint: 'compute', back: 'THE compute for web apps: tier, instance size, instance count. Apps deployed into a plan share its instances — scaling and billing happen at the plan level, not per app.' },
    { front: 'Deployment slots', hint: 'compute', back: 'Parallel app instances (staging/production). Deploy to staging, warm it, SWAP — production traffic moves to warm instances with near-zero downtime; swap back = instant rollback. "Sticky" slot settings do not travel.' },
    { front: 'Scale up vs scale out', hint: 'compute', back: 'Up = bigger SKU (more CPU/RAM per instance, manual tier change). Out = more instances of the same size, driven by autoscale rules (CPU %, schedule, queue depth). "Handle bursts automatically" = out.' },
    { front: 'App settings', hint: 'config', back: 'Platform-managed environment variables injected at startup, overriding shipped config files. Support Key Vault references — same build artifact, per-environment configuration.' },
    { front: 'Azure Functions', hint: 'serverless', back: 'Event-driven code: exactly ONE trigger starts it (HTTP, queue, timer, Cosmos change feed); input/output bindings move data declaratively without SDK plumbing.' },
    { front: 'Consumption vs Premium plan', hint: 'serverless', back: 'Consumption scales to zero (cheap, but cold starts). Premium keeps pre-warmed instances (no cold start, VNet access) for a base fee. Latency-sensitive APIs → Premium or always-ready instances.' },
    { front: 'Cold start', hint: 'serverless', back: 'First invocation after scale-to-zero pays to allocate a worker and load the runtime + app. Mitigate with Premium/always-ready instances, or accept it for spiky background work.' },
    { front: 'Durable Functions', hint: 'serverless', back: 'Stateful orchestrations on stateless functions: every await checkpoints to a history table; replay after recycling rebuilds state. Enables chaining, fan-out/fan-in, human approval waits. Orchestrator code must be deterministic.' },
    { front: 'Azure Container Registry (ACR)', hint: 'containers', back: 'Private OCI registry. "az acr build" = ACR Tasks builds cloud-side (no local daemon) and pushes in one step. Consumers pull with Entra/managed identity — no registry passwords.' },
    { front: 'Azure Container Instances (ACI)', hint: 'containers', back: '"docker run in the cloud": single containers/container groups, per-second billing, no orchestration. Burst jobs, CI agents, one-off processing — not microservice fleets.' },
    { front: 'Azure Container Apps (ACA)', hint: 'containers', back: 'Serverless containers on managed Kubernetes+KEDA: revisions, ingress with traffic splitting, Dapr, scale to zero. The middle ground between ACI (too bare) and AKS (too much cluster).' },
    { front: 'ACA revisions & traffic split', hint: 'containers', back: 'Each deploy = an immutable revision. Ingress splits traffic by percentage between revisions → canary releases and instant rollback are just weight changes.' },
    { front: 'KEDA', hint: 'containers', back: 'Event-driven autoscaling: scalers read the event source directly (queue depth, Kafka lag), so replicas can scale 0→N. CPU rules can never wake an app FROM zero — no replicas, no CPU signal.' },
    { front: 'Blob Storage tiers', hint: 'storage', back: 'Hot (frequent access) → Cool (cheaper storage, pricier reads) → Archive (offline; must rehydrate, up to hours). Lifecycle management rules move blobs automatically by age/last access.' },
    { front: 'SAS token', hint: 'storage', back: 'A signed URL granting exactly the permissions/resource/lifetime you choose. Prefer USER-DELEGATION SAS (signed with Entra key, revocable) over account-key SAS. For "external partner, one blob, 24h".' },
    { front: 'Storage Blob Data roles', hint: 'storage', back: 'Data-plane RBAC (Reader/Contributor/Owner on blob data). A valid Entra token WITHOUT one of these = 403 AuthorizationPermissionMismatch — even for subscription Owners. Auth ≠ authz.' },
    { front: 'Cosmos DB partition key', hint: 'cosmos', back: 'Hash determines document placement. Queries including it hit ONE partition (cheap); without it, fan-out to ALL partitions multiplies RU cost. High cardinality + present in hot queries. Immutable after creation.' },
    { front: 'Request Units (RUs)', hint: 'cosmos', back: 'The currency of every Cosmos operation. Exceed provisioned throughput → 429 TooManyRequests + retry-after; the SDK retries automatically. Persistent 429s = more RUs or cheaper queries.' },
    { front: 'Session consistency', hint: 'cosmos', back: 'The default level: read-your-own-writes within a session; other sessions may lag briefly. The pragmatic middle between Strong (global latest, slow) and Eventual (no ordering).' },
    { front: 'Change feed', hint: 'cosmos', back: 'Ordered per-partition log of inserts/updates. Consume with the Functions Cosmos trigger or change-feed processor (leases + checkpoints handled) to build materialized views and event pipelines.' },
    { front: 'Managed identity', hint: 'identity', back: 'An Entra identity the PLATFORM proves for your workload — app calls the local identity endpoint, gets a token, presents it to Key Vault/Blob/Cosmos. Zero credentials in config.' },
    { front: 'System- vs user-assigned MI', hint: 'identity', back: 'System-assigned: 1:1 with the resource, dies with it, zero management. User-assigned: standalone resource attachable to many workloads — share one identity (and one set of role grants) across a fleet.' },
    { front: 'Key Vault', hint: 'security', back: 'Central store for secrets/keys/certs with per-identity access and full audit logging. Apps reference secrets by NAME (unversioned = latest), so rotation is vault-side — no redeploy, no config change.' }
  ]
});
</script>
