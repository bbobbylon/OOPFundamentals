<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HTTP Status Codes — Flashcards</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#22d3ee; --border:#334155; --blue:#22d3ee; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    .container { max-width:760px; margin:0 auto; }
    a.back { color:var(--blue); text-decoration:none; font-size:14px; }
    h1 { margin:6px 0 4px; font-size:25px; color:var(--accent); }
    p.sub { margin:0 0 20px; color:var(--muted); line-height:1.6; }
  </style>
  <link rel="stylesheet" href="devhub.css" />
</head>
<body class="track-tools">
<div class="container">
  <a class="back" href="app.html">← Hub</a>
  <h1>HTTP Status Codes — Flashcards</h1>
  <p class="sub">Essential for REST API design, Spring/Angular work, and interviews. Front = code; back = meaning and when to use it.</p>
  <div id="deck"></div>
</div>
<script src="devhub-flashcards.js"></script>
<script>
DevHubFlash.render(document.getElementById('deck'), {
  id: 'http-codes', title: 'HTTP Status Codes', subtitle: 'name the meaning', accent: '#22d3ee',
  cards: [
    { front: '200 OK', hint: '2xx success', back: 'Request succeeded; response body has the result (GET, or a body-returning POST/PUT).' },
    { front: '201 Created', hint: '2xx success', back: 'Resource created — return it (and a Location header) after a successful POST.' },
    { front: '202 Accepted', hint: '2xx success', back: 'Request accepted for async processing; not yet completed.' },
    { front: '204 No Content', hint: '2xx success', back: 'Success with no body — typical for DELETE or a PUT that returns nothing.' },
    { front: '301 Moved Permanently', hint: '3xx redirect', back: 'Resource permanently moved; clients/caches should update the URL.' },
    { front: '302 Found', hint: '3xx redirect', back: 'Temporary redirect to another URL.' },
    { front: '304 Not Modified', hint: '3xx redirect', back: 'Cached copy is still valid (conditional GET via ETag/If-None-Match) — no body sent.' },
    { front: '307 / 308', hint: '3xx redirect', back: 'Temporary / Permanent redirect that preserves the HTTP method and body.' },
    { front: '400 Bad Request', hint: '4xx client', back: 'Malformed/invalid request — e.g. failed @Valid validation in Spring.' },
    { front: '401 Unauthorized', hint: '4xx client', back: 'Not authenticated — missing/invalid credentials or token. (Really "unauthenticated".)' },
    { front: '403 Forbidden', hint: '4xx client', back: 'Authenticated but not allowed — lacks the required role/permission.' },
    { front: '404 Not Found', hint: '4xx client', back: 'Resource doesn’t exist (or you hide it for authorization reasons).' },
    { front: '405 Method Not Allowed', hint: '4xx client', back: 'The HTTP method isn’t supported for this resource (e.g. POST to a GET-only path).' },
    { front: '409 Conflict', hint: '4xx client', back: 'Request conflicts with current state — e.g. duplicate unique key, version conflict.' },
    { front: '415 Unsupported Media Type', hint: '4xx client', back: 'The Content-Type isn’t supported (e.g. sent XML to a JSON-only endpoint).' },
    { front: '422 Unprocessable Entity', hint: '4xx client', back: 'Syntactically valid but semantically invalid — often used for validation errors.' },
    { front: '429 Too Many Requests', hint: '4xx client', back: 'Rate limit exceeded; usually with a Retry-After header.' },
    { front: '500 Internal Server Error', hint: '5xx server', back: 'Unhandled server-side error — the generic "something broke on our end".' },
    { front: '502 Bad Gateway', hint: '5xx server', back: 'A gateway/proxy got an invalid response from an upstream server.' },
    { front: '503 Service Unavailable', hint: '5xx server', back: 'Server temporarily down/overloaded; often with Retry-After.' },
    { front: '504 Gateway Timeout', hint: '5xx server', back: 'A gateway/proxy timed out waiting for an upstream response.' },
    { front: 'What does the 1xx class mean?', hint: 'classes', back: 'Informational — request received, continuing (e.g. 100 Continue, 101 Switching Protocols).' },
    { front: 'Which class is "your fault" vs "server fault"?', hint: 'classes', back: '4xx = client error (fix the request); 5xx = server error (fix the server).' },
    { front: '401 vs 403 — the difference', hint: 'gotcha', back: '401 = WHO are you? (authenticate). 403 = I know you, but you’re not allowed (authorize).' }
  ]
});
</script>
<script src="devhub-notebook.js"></script>
<script src="devhub-transitions.js"></script>
</body>
</html>
