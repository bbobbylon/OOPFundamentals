<!doctype html>
<html lang="en" data-hf data-notebook-app>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Your progress — Dev Hub</title>
  <link rel="stylesheet" href="devhub.css" />
  <link rel="stylesheet" href="devhub-hf.css"/>
  <style>
    /* ── stat tiles ──────────────────────────────────────────────────────
       A hero number is a chart form in its own right: one value, read at a
       glance, with the context that makes it mean something underneath. */
    .st-grid{ display:grid; gap:14px; grid-template-columns:repeat(2,1fr); margin:0 0 22px; }
    @media(min-width:760px){ .st-grid{ grid-template-columns:repeat(4,1fr); } }
    .st-tile{ background:var(--hf-card); border-radius:var(--hf-r); padding:20px 20px 18px; }
    .st-tile .lbl{
      font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
      color:var(--hf-muted); display:block; margin-bottom:12px;
    }
    .st-tile .val{
      font-family:var(--font-display); font-weight:700; font-size:38px; line-height:1;
      color:var(--hf-orange);
    }
    .st-tile .val .unit{ font-family:var(--font-b,inherit); font-size:14px; font-weight:400; color:var(--hf-ink2); margin-left:6px; }
    .st-tile.ok .val{ color:#a8d17a; }
    .st-tile .foot{ display:block; margin-top:10px; font-size:12px; color:var(--hf-muted); line-height:1.5; }

    .st-panels{ display:grid; gap:16px; }
    @media(min-width:860px){ .st-panels{ grid-template-columns:1.25fr .75fr; align-items:start; } }
    .st-panel{ background:var(--hf-card); border-radius:var(--hf-r); padding:22px 24px; }
    .st-panel h2{
      font-size:11px !important; font-weight:700 !important; letter-spacing:.11em;
      text-transform:uppercase; color:var(--hf-muted) !important;
      font-family:inherit !important; margin:0 0 18px !important;
    }

    /* ── bar chart: completion by track ──────────────────────────────────
       Magnitude, one series -> ONE hue, no categorical palette and no legend
       (the title names it). Bars carry a 4px rounded data-end and a direct
       label, so the value never depends on reading a gridline. */
    .st-bars{ display:flex; flex-direction:column; gap:11px; }
    .st-bar{ display:grid; grid-template-columns:112px 1fr auto; gap:11px; align-items:center; }
    .st-bar .name{
      font-size:12.5px; color:var(--hf-ink2); overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap;
    }
    .st-bar .track{ background:rgba(0,0,0,.28); border-radius:5px; height:10px; overflow:hidden; }
    .st-bar .fill{ height:100%; background:#ef7a45; border-radius:0 5px 5px 0; min-width:2px; }
    .st-bar .num{ font-size:12px; color:var(--hf-muted); font-variant-numeric:tabular-nums; }

    /* ── donut: overall completion ───────────────────────────────────────
       Status, not categorical: mastered / in progress / locked, each with a
       swatch AND a label AND a count, so identity is never colour alone. */
    .st-donut{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; justify-content:center; }
    .st-donut figure{ margin:0; position:relative; }
    .st-donut .mid{
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-family:var(--font-display); font-weight:700; font-size:26px; color:var(--hf-ink);
    }
    .st-legend{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
    .st-legend li{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--hf-ink2); }
    .st-legend .sw{ width:11px; height:11px; border-radius:3px; flex:none; }

    .st-recent{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
    .st-recent a{
      display:block; background:rgba(0,0,0,.22); border-radius:13px; padding:13px 16px;
      color:var(--hf-ink); font-size:14.5px; text-decoration:none;
    }
    .st-recent a:hover{ color:var(--hf-orange); }
    .st-recent .tk{ display:block; font-size:11.5px; color:var(--hf-muted); margin-top:3px; }

    .st-empty{ color:var(--hf-muted); font-size:14px; line-height:1.6; margin:0; }
    .st-note{
      margin-top:26px; font-size:12.5px; color:var(--hf-muted); line-height:1.6;
      border-top:1px solid var(--hf-line); padding-top:16px;
    }
  </style>
</head>
<body>
<div class="container">
  <a class="back" href="app.html">← back to Dev Hub</a>

  <h1 id="greet">Your progress</h1>
  <p class="hf-deck" id="deck">everything below is read from this browser — nothing is invented</p>

  <div class="st-grid" id="tiles"></div>

  <div class="st-panels">
    <div class="st-panel">
      <h2>Completion by track</h2>
      <div class="st-bars" id="bars"></div>
    </div>
    <div class="st-panel">
      <h2>Overall</h2>
      <div class="st-donut" id="donut"></div>
    </div>
  </div>

  <div class="st-panel" style="margin-top:16px">
    <h2>Pick up where you left off</h2>
    <ul class="st-recent" id="recent"></ul>
  </div>

  <p class="st-note" id="note"></p>
</div>

<script src="tracks-data.js"></script>
<script>
/* ============================================================================
 * Personal stats, computed from what DevHub ACTUALLY records in this browser:
 *   dlh_progress_v1   file -> status        (set when you mark a page learned)
 *   dlh_streak_v1     {lastDate, count}     (consecutive-day counter)
 *   dlh_recent_v1     [{file,title,trackLabel}]
 *   dlh-quiz:<bankId> [{...attempts}]       (per-bank attempt history)
 *
 * Deliberately NOT shown: minutes studied per day. Nothing in DevHub records
 * time on page, so any such chart would be invented. When time tracking
 * exists, this is where it goes.
 * ========================================================================== */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var read = function (k, dflt) {
    try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? dflt : v; }
    catch (e) { return dflt; }
  };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  var tracks = window.DEVHUB_TRACKS || [];
  var progress = read('dlh_progress_v1', {}) || {};
  var streak = read('dlh_streak_v1', { count: 0, lastDate: null }) || { count: 0 };
  var recent = read('dlh_recent_v1', []) || [];

  /* ── derive ─────────────────────────────────────────────────────────── */
  var isDone = function (v) { return v === 'learned' || v === true || v === 'done'; };

  var perTrack = tracks.map(function (t) {
    var files = [];
    (t.sections || []).forEach(function (s) {
      (s.pages || []).forEach(function (p) { if (p && p.file) files.push(p.file); });
    });
    var done = files.filter(function (f) { return isDone(progress[f]); }).length;
    return { label: t.label, icon: t.icon || '', total: files.length, done: done };
  }).filter(function (t) { return t.total > 0; });

  var totalPages = perTrack.reduce(function (n, t) { return n + t.total; }, 0);
  var totalDone = perTrack.reduce(function (n, t) { return n + t.done; }, 0);
  var tracksStarted = perTrack.filter(function (t) { return t.done > 0; }).length;

  // Quiz accuracy across every stored bank history.
  var quizPct = null, quizAttempts = 0;
  try {
    var sum = 0, n = 0;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k.indexOf('dlh-quiz:') !== 0) continue;
      var hist = read(k, []) || [];
      hist.forEach(function (a) {
        var pct = typeof a.pct === 'number' ? a.pct
                : (typeof a.score === 'number' && typeof a.total === 'number' && a.total)
                  ? (a.score / a.total) * 100 : null;
        if (pct != null && isFinite(pct)) { sum += pct; n++; }
      });
    }
    if (n) { quizPct = Math.round(sum / n); quizAttempts = n; }
  } catch (e) {}

  /* ── stat tiles ─────────────────────────────────────────────────────── */
  var pct = totalPages ? Math.round((totalDone / totalPages) * 100) : 0;
  var tiles = [
    { lbl: 'Streak', val: streak.count || 0, unit: (streak.count === 1 ? 'day' : 'days'),
      foot: streak.count ? 'Keep it going — marking one page holds it.' : 'Mark a page learned to start one.' },
    { lbl: 'Concepts done', val: totalDone, unit: 'of ' + totalPages,
      foot: pct + '% of the whole hub' },
    { lbl: 'Tracks started', val: tracksStarted, unit: 'of ' + perTrack.length,
      foot: tracksStarted ? 'Depth beats breadth — finish one before opening a fifth.' : 'Nothing started yet.' },
    quizPct == null
      ? { lbl: 'Quiz accuracy', val: '—', unit: '', foot: 'No quiz attempts recorded yet.' }
      : { lbl: 'Quiz accuracy', val: quizPct + '%', unit: '', ok: true,
          foot: 'Across ' + quizAttempts + ' attempt' + (quizAttempts === 1 ? '' : 's') }
  ];
  $('tiles').innerHTML = tiles.map(function (t) {
    return '<div class="st-tile' + (t.ok ? ' ok' : '') + '">' +
      '<span class="lbl">' + esc(t.lbl) + '</span>' +
      '<div class="val">' + esc(t.val) + (t.unit ? '<span class="unit">' + esc(t.unit) + '</span>' : '') + '</div>' +
      '<span class="foot">' + esc(t.foot) + '</span></div>';
  }).join('');

  /* ── bar chart — completion by track, one hue, direct-labelled ──────── */
  var started = perTrack.filter(function (t) { return t.done > 0; })
    .sort(function (a, b) { return (b.done / b.total) - (a.done / a.total); })
    .slice(0, 8);
  $('bars').innerHTML = started.length
    ? started.map(function (t) {
        var p = Math.round((t.done / t.total) * 100);
        return '<div class="st-bar">' +
          '<span class="name" title="' + esc(t.label) + '">' + esc(t.icon + ' ' + t.label) + '</span>' +
          '<span class="track"><span class="fill" style="width:' + Math.max(p, 1) + '%"></span></span>' +
          '<span class="num">' + t.done + '/' + t.total + '</span></div>';
      }).join('')
    : '<p class="st-empty">No track has any pages marked learned yet. Open a lesson and hit “+ Learned” — this fills in as you go.</p>';

  /* ── donut — status, with swatch + label + count in the legend ──────── */
  (function () {
    var inProgress = perTrack.reduce(function (n, t) {
      return n + (t.done > 0 && t.done < t.total ? t.total - t.done : 0); }, 0);
    var locked = Math.max(totalPages - totalDone - inProgress, 0);
    var parts = [
      { k: 'Mastered', v: totalDone, c: '#a8d17a' },
      { k: 'In progress', v: inProgress, c: '#ef7a45' },
      { k: 'Not started', v: locked, c: '#6b5c4d' }
    ];
    var R = 52, C = 2 * Math.PI * R, off = 0;
    var segs = parts.map(function (p) {
      var frac = totalPages ? p.v / totalPages : 0;
      var s = '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="' + p.c +
        '" stroke-width="17" stroke-dasharray="' + (frac * C) + ' ' + C +
        '" stroke-dashoffset="' + (-off * C) + '" transform="rotate(-90 70 70)"></circle>';
      off += frac; return frac > 0 ? s : '';
    }).join('');
    $('donut').innerHTML =
      '<figure><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="' +
      pct + ' percent of pages marked learned">' +
      '<circle r="' + R + '" cx="70" cy="70" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="17"></circle>' +
      segs + '</svg><div class="mid">' + pct + '%</div></figure>' +
      '<ul class="st-legend">' + parts.map(function (p) {
        return '<li><span class="sw" style="background:' + p.c + '"></span>' +
          esc(p.v + ' ' + p.k.toLowerCase()) + '</li>'; }).join('') + '</ul>';
  })();

  /* ── recent ─────────────────────────────────────────────────────────── */
  $('recent').innerHTML = recent.length
    ? recent.slice(0, 5).map(function (r) {
        return '<li><a href="' + esc(r.file) + '">' + esc(r.title || r.file) +
          '<span class="tk">' + esc(r.trackLabel || '') + '</span></a></li>'; }).join('')
    : '<li><p class="st-empty">Nothing visited yet. Anything you open from the hub shows up here.</p></li>';

  /* ── honest footnote + greeting ─────────────────────────────────────── */
  var user = null; try { user = JSON.parse(localStorage.getItem('dlh_user') || 'null'); } catch (e) {}
  var name = user && (user.name || user.username || user.email);
  if (name) $('greet').textContent = 'Nice pace, ' + String(name).split(/[@ ]/)[0];
  if (!totalDone) {
    $('deck').textContent = 'nothing tracked yet — this page fills in as you mark pages learned';
  }
  $('note').textContent =
    'Everything here is computed from this browser’s own localStorage — progress, streak, ' +
    'recently-viewed and quiz attempts. There is no “minutes studied” chart because DevHub does ' +
    'not record time on page; a chart of invented numbers would be worse than no chart.';
})();
</script>
<script src="devhub-notebook.js"></script>
<script src="devhub-hf-theme.js"></script>
</body>
</html>
