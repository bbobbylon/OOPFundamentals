# Build the backend (ACR Tasks) and deploy to Azure Container Apps.
# Manual-only (workflow_dispatch) so it never auto-runs or fails until you've
# configured the secrets below. Flip on the `push` trigger once it's wired.
#
# Required repository secrets (federated OIDC — no client secret):
#   AZURE_CLIENT_ID        app registration / managed identity client id
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#   AZURE_RESOURCE_GROUP   e.g. devhub-rg
#   ACA_APP_NAME           e.g. devhub-backend
# Provide DB/JWT/CORS values as secrets too, or set them once on the app.
name: Deploy backend → Azure Container Apps

on:
  workflow_dispatch:
  # push:
  #   branches: [ master ]
  #   paths: [ 'backend/**' ]

permissions:
  id-token: write   # required for Azure OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build from ./backend and deploy to Container Apps
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp up \
              --name "${{ secrets.ACA_APP_NAME }}" \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --source ./backend \
              --ingress external \
              --target-port 8080 \
              --env-vars SPRING_PROFILES_ACTIVE=prod EXEC_ENABLED=false
