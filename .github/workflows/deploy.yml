name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    paths: ['frontend/**']      # validate PRs too; only master actually deploys
  workflow_dispatch:

# Least privilege at the workflow level: the `validate` job is triggered by
# `pull_request` and only ever READS the tree, so it must not inherit the Pages
# write token. pages:write + id-token:write are granted on the `deploy` job
# alone, which is the only job that publishes and never runs on a PR.
permissions:
  contents: read

concurrency:
  group: pages
  # NOT cancel-in-progress. GitHub's own guidance for Pages is to let a
  # running deployment finish — cancelling mid-publish can leave the site
  # serving a half-updated artifact.
  cancel-in-progress: false

jobs:
  # ── gate ────────────────────────────────────────────────────────────────
  # Nothing validated this site before: a broken page shipped straight to
  # Pages on every push. tmp_vcheck.mjs is zero-dependency and scans all 527
  # pages in well under a second, so there is no reason not to gate on it.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # tmp_assetcheck.mjs diffs against the base branch, which a shallow
          # clone does not have.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate site
        run: node tmp_vcheck.mjs
        working-directory: frontend

      # Doc comments decay the way the CodeWalk indices did: one undocumented
      # helper, then three. Zero-dependency, sub-second, so it gates too.
      - name: Check engines, gates and backend are documented
        run: node tmp_doccheck.mjs
        working-directory: frontend

      # Only meaningful on a PR, where there IS a base to compare against.
      # On master the branch has already merged, so "before" is itself.
      - name: Check no teaching content was silently deleted
        if: github.event_name == 'pull_request'
        run: node tmp_assetcheck.mjs origin/${{ github.base_ref }}
        working-directory: frontend

      - name: Check chapter rail data is loadable
        run: node -e "const w={};new Function('window',require('fs').readFileSync('tracks-data.js','utf8'))(w);if(!Array.isArray(w.DEVHUB_TRACKS))throw new Error('DEVHUB_TRACKS missing');console.log('tracks-data.js OK:',w.DEVHUB_TRACKS.length,'tracks')"
        working-directory: frontend

  # ── deploy ──────────────────────────────────────────────────────────────
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write          # only this job publishes
      id-token: write       # OIDC token for actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-create/enable the Pages site if it doesn't exist yet, instead of
          # failing with "Get Pages site failed / HttpError: Not Found". Requires the
          # pages:write + id-token:write, granted on THIS job only.
          enablement: true

      # Stage only what the public site needs. The previous version uploaded
      # frontend/ wholesale, which published the dev server, its __pycache__,
      # and every tmp_*.mjs build/validation script.
      - name: Stage publishable content
        run: |
          mkdir -p _site
          rsync -a --delete \
            --exclude='devserver.py' \
            --exclude='__pycache__/' \
            --exclude='tmp_*.mjs' \
            --exclude='tmp_shots/' \
            --exclude='tmp_*' \
            --exclude='.*/' \
            frontend/ _site/
          touch _site/.nojekyll
          echo "staged $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
