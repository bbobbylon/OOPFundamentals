name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Auto-create/enable the Pages site if it doesn't exist yet, instead of
          # failing with "Get Pages site failed / HttpError: Not Found". Requires the
          # pages:write + id-token:write permissions above (already granted).
          enablement: true

      - name: Upload frontend as Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
