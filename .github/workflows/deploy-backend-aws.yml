# Build the backend image and ship it to AWS App Runner.
# Manual-only (workflow_dispatch) so it never auto-runs or fails until you've
# configured the secrets below. Flip on the `push` trigger once it's wired.
#
# Required repository secrets:
#   AWS_ROLE_ARN            IAM role for GitHub OIDC (trusts token.actions.githubusercontent.com)
#   AWS_REGION              e.g. us-east-1
#   ECR_REPOSITORY          e.g. devhub-backend
#   APPRUNNER_SERVICE_ARN   the App Runner service ARN (after first create-service)
name: Deploy backend → AWS App Runner

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build/push
        default: latest
  # push:
  #   branches: [ master ]
  #   paths: [ 'backend/**' ]

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.event.inputs.image_tag || 'latest' }}
        run: |
          docker build --build-arg INCLUDE_RUNTIMES=false -t "$REGISTRY/$REPO:$TAG" ./backend
          docker push "$REGISTRY/$REPO:$TAG"

      - name: Trigger App Runner deployment
        run: aws apprunner start-deployment --service-arn "${{ secrets.APPRUNNER_SERVICE_ARN }}"
